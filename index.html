<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>English Quest (Lớp 1 - Lớp 9) - Global Success Edition</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Nunito', sans-serif;
      background-color: #0f172a;
      color: #f1f5f9;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* 3D Game Buttons */
    .btn-3d {
      transition: all 0.1s ease;
      box-shadow: 0 4px 0 rgba(0, 0, 0, 0.35);
    }
    .btn-3d:active:not(:disabled) {
      transform: translateY(3px);
      box-shadow: 0 1px 0 rgba(0, 0, 0, 0.35);
    }
    .btn-3d:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      box-shadow: none;
      transform: translateY(2px);
    }

    .btn-green { background-color: #22c55e; box-shadow: 0 4px 0 #15803d; color: #052e16; }
    .btn-green:hover:not(:disabled) { background-color: #4ade80; }

    .btn-blue { background-color: #38bdf8; box-shadow: 0 4px 0 #0284c7; color: #082f49; }
    .btn-blue:hover:not(:disabled) { background-color: #7dd3fc; }

    .btn-purple { background-color: #c084fc; box-shadow: 0 4px 0 #7e22ce; color: #2e1065; }
    .btn-purple:hover:not(:disabled) { background-color: #d8b4fe; }

    .btn-amber { background-color: #facc15; box-shadow: 0 4px 0 #ca8a04; color: #422006; }
    .btn-amber:hover:not(:disabled) { background-color: #fde047; }

    .btn-red { background-color: #f87171; box-shadow: 0 4px 0 #b91c1c; color: #450a0a; }
    .btn-red:hover:not(:disabled) { background-color: #fca5a5; }

    .btn-dark { background-color: #1e293b; box-shadow: 0 4px 0 #090d16; border: 2px solid #334155; color: #f8fafc; }
    .btn-dark:hover:not(:disabled) { background-color: #273549; border-color: #475569; }

    /* 3D Flip Card */
    .perspective-1000 { perspective: 1000px; }
    .transform-style-3d { transform-style: preserve-3d; transition: transform 0.5s cubic-bezier(0.4, 0.2, 0.2, 1); }
    .backface-hidden { backface-visibility: hidden; }
    .rotate-y-180 { transform: rotateY(180deg); }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    .animate-float { animation: float 3s ease-in-out infinite; }

    @keyframes popIn {
      0% { transform: scale(0.85); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .animate-pop { animation: popIn 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }

    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>

  <script>
    /**
     * ============================================================================
     * 1. WEB AUDIO SOUND EFFECTS
     * ============================================================================
     */
    class SoundFX {
      constructor() {
        this.enabled = true;
        this.ctx = null;
      }
      init() {
        if (!this.ctx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (AC) this.ctx = new AC();
        }
        if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
      }
      playTone(freq, type, duration, delay = 0, vol = 0.14) {
        if (!this.enabled) return;
        try {
          this.init();
          if (!this.ctx) return;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime + delay);
          gain.gain.setValueAtTime(vol, this.ctx.currentTime + delay);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + delay + duration);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(this.ctx.currentTime + delay);
          osc.stop(this.ctx.currentTime + delay + duration);
        } catch (e) {}
      }
      click() { this.playTone(540, 'sine', 0.07, 0, 0.09); }
      correct() {
        this.playTone(587.33, 'triangle', 0.12, 0, 0.16);
        this.playTone(880, 'triangle', 0.24, 0.09, 0.18);
      }
      wrong() {
        this.playTone(210, 'sawtooth', 0.16, 0, 0.14);
        this.playTone(165, 'sawtooth', 0.22, 0.11, 0.14);
      }
      levelUp() {
        [523.25, 659.25, 783.99, 1046.50].forEach((f, i) => this.playTone(f, 'triangle', 0.2, i * 0.09, 0.18));
      }
      victory() {
        const notes = [523.25, 659.25, 783.99, 1046.50, 783.99, 1046.50];
        const times = [0, 0.1, 0.2, 0.3, 0.45, 0.58];
        notes.forEach((f, i) => this.playTone(f, 'sine', 0.22, times[i], 0.2));
      }
      coin() {
        this.playTone(987.77, 'sine', 0.08, 0, 0.14);
        this.playTone(1318.51, 'sine', 0.18, 0.07, 0.14);
      }
    }
    const sfx = new SoundFX();

    /**
     * ============================================================================
     * 2. SPEECH SYNTHESIS (ENGLISH PRONUNCIATION)
     * ============================================================================
     */
    function speakEnglish(text, slow = false) {
      sfx.click();
      if (!('speechSynthesis' in window)) {
        app.showToast('Trình duyệt không hỗ trợ đọc giọng nói.', '⚠️');
        return;
      }
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'en-US';
      utter.rate = slow ? 0.78 : 0.92;
      const voices = window.speechSynthesis.getVoices();
      const enVoice = voices.find(v => v.lang.includes('en-US') && v.name.includes('Google')) || voices.find(v => v.lang.includes('en'));
      if (enVoice) utter.voice = enVoice;
      window.speechSynthesis.speak(utter);
    }

    /**
     * ============================================================================
     * 3. CURRICULUM COMPILER: GLOBAL SUCCESS GRADES 1 TO 9 (FULL SYLLABUS)
     * ============================================================================
     * Compact tuple format for rich, comprehensive coverage of all 9 grades:
     * Grade 1 & 2: 16 Units each (Phonics, Basic Vocab, Simple Patterns)
     * Grade 3, 4, 5: 20 Units each (Primary Global Success Syllabus)
     * Grade 6, 7, 8, 9: 12 Units each (Secondary Global Success Syllabus)
     */
    const GRADE_META = [
      { grade: 1, level: "Tiểu học", title: "Tiếng Anh 1", unitsCount: 16, color: "from-pink-500 to-rose-600", icon: "🧸", desc: "Làm quen bảng chữ cái, phát âm Phonics & từ vựng đầu đời" },
      { grade: 2, level: "Tiểu học", title: "Tiếng Anh 2", unitsCount: 16, color: "from-orange-500 to-amber-600", icon: "🎈", desc: "Mở rộng âm vần, đồ vật xung quanh & giao tiếp cơ bản" },
      { grade: 3, level: "Tiểu học", title: "Tiếng Anh 3", unitsCount: 20, color: "from-amber-500 to-yellow-600", icon: "🎒", desc: "Chào hỏi, gia đình, trường học, màu sắc & sở thích" },
      { grade: 4, level: "Tiểu học", title: "Tiếng Anh 4", unitsCount: 20, color: "from-lime-500 to-green-600", icon: "🚲", desc: "Quốc tịch, thời gian biểu, thời tiết & hoạt động hàng ngày" },
      { grade: 5, level: "Tiểu học", title: "Tiếng Anh 5", unitsCount: 20, color: "from-emerald-500 to-teal-600", icon: "🚀", desc: "Quê hương, kỳ nghỉ, sức khỏe, truyện cổ tích & tương lai" },
      { grade: 6, level: "THCS", title: "Tiếng Anh 6", unitsCount: 12, color: "from-cyan-500 to-sky-600", icon: "🏫", desc: "Ngôi trường mới, nhà cửa, bạn bè, kỳ quan & thành phố" },
      { grade: 7, level: "THCS", title: "Tiếng Anh 7", unitsCount: 12, color: "from-sky-500 to-blue-600", icon: "🎨", desc: "Sở thích, sức khỏe, âm nhạc, lễ hội & nguồn năng lượng" },
      { grade: 8, level: "THCS", title: "Tiếng Anh 8", unitsCount: 12, color: "from-indigo-500 to-violet-600", icon: "🌏", desc: "Thời gian rảnh, cuộc sống nông thôn, công nghệ & vũ trụ" },
      { grade: 9, level: "THCS", title: "Tiếng Anh 9", unitsCount: 12, color: "from-purple-500 to-fuchsia-600", icon: "🎓", desc: "Cộng đồng, đô thị, kỳ quan thiên nhiên, Trái Đất & hướng nghiệp" }
    ];

    const GRADIENTS = [
      "from-emerald-500 to-teal-600",
      "from-sky-500 to-blue-600",
      "from-rose-500 to-pink-600",
      "from-amber-500 to-orange-600",
      "from-purple-500 to-indigo-600",
      "from-cyan-500 to-teal-600",
      "from-lime-500 to-green-600",
      "from-fuchsia-500 to-purple-600"
    ];

    // Helper to build rich Unit objects from compact syllabus specs
    function buildUnit(grade, id, sem, title, viTitle, icon, grammarTag, bossName, bossIcon, vocabRaw, grammarPoints, quizRaw, sentenceRaw) {
      const vocab = vocabRaw.map(v => ({
        word: v[0],
        ipa: v[1],
        type: v[2],
        meaning: v[3],
        example: v[4]
      }));

      const grammarQuiz = quizRaw.map(q => ({
        q: q[0],
        options: q[1],
        answer: q[2],
        explain: q[3]
      }));

      const sentences = sentenceRaw.map(s => ({
        hint: s[0],
        words: s[1].split(' ')
      }));

      // Auto-generate 4 diverse boss questions from quiz + vocab
      const bossQuestions = [
        ...grammarQuiz.slice(0, 3),
        {
          q: `Từ tiếng Anh nào có nghĩa là "${vocab[0].meaning}"?`,
          options: [vocab[0].word, vocab[1].word, vocab[2].word, vocab[3].word].sort(() => Math.random() - 0.5),
          answer: 0, // fixed below
          explain: `"${vocab[0].word}" ${vocab[0].ipa} có nghĩa là "${vocab[0].meaning}". Ví dụ: ${vocab[0].example}`
        }
      ];
      // Fix answer index for the auto-generated vocab boss question
      const lastQ = bossQuestions[bossQuestions.length - 1];
      lastQ.answer = lastQ.options.indexOf(vocab[0].word);

      return {
        grade,
        id,
        semester: sem,
        code: `UNIT ${id}`,
        title,
        viTitle,
        icon,
        grammarTag,
        gradient: GRADIENTS[(id - 1) % GRADIENTS.length],
        bossName,
        bossIcon,
        badge: {
          id: `g${grade}_u${id}`,
          name: `Lớp ${grade} • Huy Hiệu Unit ${id}`,
          icon: icon,
          desc: `Chinh phục Lớp ${grade} - Unit ${id}: ${title}`
        },
        vocab,
        grammarNote: {
          title: grammarTag,
          points: grammarPoints
        },
        grammarQuiz,
        sentences,
        bossQuestions
      };
    }

    // Raw Syllabus Repository for Grades 1 to 9 (Global Success)
    const RAW_CURRICULUM = {
      // ==================== GRADE 1 (16 UNITS) ====================
      1: [
        [1,1,"In the school playground","Ở sân chơi trường","🛝","Phonics: Letter B /b/","Hộ Vệ Chữ B","🐝",
          [["ball","/bɔːl/","(n)","quả bóng","I have a red ball."],["bike","/baɪk/","(n)","xe đạp","It is my bike."],["book","/bʊk/","(n)","quyển sách","Open your book."],["bill","/bɪl/","(n)","tên riêng Bill","Hi, I'm Bill."]],
          ["<b>Âm /b/ (Letter B):</b> Phát âm bật môi nhẹ /b/ như trong <i>ball, bike, book</i>.","<b>Mẫu câu chào:</b> <i>Hi, I'm + tên.</i> (Xin chào, mình là...)"],
          [["Từ nào bắt đầu bằng chữ cái B?",["ball","cat","apple","dog"],0,"'ball' (quả bóng) bắt đầu bằng chữ B."],["Điền từ còn thiếu: Hi, ______ Bill.",["I'm","is","are","you"],0,"Dùng 'I'm' để giới thiệu tên mình."],["'book' có nghĩa là gì?",["quyển sách","quả bóng","xe đạp","con mèo"],0,"'book' nghĩa là quyển sách."]],
          [["Xin chào, mình là Bill.","Hi, I'm Bill."],["Mình có một quả bóng.","I have a ball."]]],
        [2,1,"In the dining room","Trong phòng ăn","🍽️","Phonics: Letter C /k/","Vua Phòng Ăn","🎂",
          [["cake","/keɪk/","(n)","bánh ngọt","I have a cake."],["car","/kɑː/","(n)","xe ô tô","It is a blue car."],["cat","/kæt/","(n)","con mèo","I have a cat."],["cup","/kʌp/","(n)","cái cốc","A cup of tea."]],
          ["<b>Âm /k/ (Letter C):</b> Phát âm /k/ rõ ràng trong <i>cake, car, cat, cup</i>.","<b>Mẫu câu sở hữu:</b> <i>I have a + danh từ số ít.</i> (Mình có một...)"],
          [["Từ nào có nghĩa là 'bánh ngọt'?",["cake","cup","cat","car"],0,"'cake' nghĩa là bánh ngọt."],["I ______ a cute cat.",["have","is","am","are"],0,"'I have a cat' = Mình có một con mèo."],["Chữ cái đầu của 'car' là gì?",["C","B","A","D"],0,"'car' bắt đầu bằng chữ C."]],
          [["Mình có một chiếc bánh ngọt.","I have a cake."],["Nó là một con mèo.","It is a cat."]]],
        [3,1,"At the street market","Ở chợ đường phố","🛍️","Phonics: Letter A /æ/","Thương Gia Nhí","🍎",
          [["apple","/ˈæpl/","(n)","quả táo","This is my apple."],["bag","/bæɡ/","(n)","cái túi, cặp","This is my bag."],["can","/kæn/","(n)","lon nước","A can of juice."],["hat","/hæt/","(n)","cái mũ","This is my hat."]],
          ["<b>Âm /æ/ (Letter A):</b> Mở rộng miệng đọc âm /æ/ như trong <i>apple, bag, hat</i>.","<b>Mẫu câu chỉ đồ vật của mình:</b> <i>This is my + đồ vật.</i> (Đây là ... của mình.)"],
          [["'This is my bag' nghĩa là gì?",["Đây là cặp của mình.","Đây là mũ của mình.","Kia là quả táo.","Mình có quả bóng."],0,"'bag' là cái túi/cặp sách."],["Từ nào chứa âm /æ/?",["apple","book","bike","cup"],0,"'apple' có âm /æ/ ở đầu."],["This is ______ hat.",["my","I","you","he"],0,"Dùng 'my' (của tôi) trước danh từ 'hat'."]],
          [["Đây là quả táo của mình.","This is my apple."],["Đây là cái mũ của mình.","This is my hat."]]],

        [12,2,"Our Tet holiday","Kỳ nghỉ Tết của chúng ta","🧧","Will you...? & Future plans","Sứ Giả Mùa Xuân","🌸",
          [["decorate the house","/ˈdekəreɪt ðə haʊs/","(phr)","trang trí nhà cửa","We'll decorate the house."],["make banh chung","/meɪk bɑːn tʃʊŋ/","(phr)","gói bánh chưng","My family will make banh chung."],["fireworks display","/ˈfaɪəwɜːks dɪˈspleɪ/","(n)","màn bắn pháo hoa","We'll watch the fireworks display."],["visit grandparents","/ˈvɪzɪt ˈɡrænpeərənts/","(phr)","thăm ông bà","I'll visit my grandparents."]],
          ["<b>Thì Tương lai đơn với 'will' (dự định dịp Tết):</b><br>• <i>Will you make banh chung for Tet? → Yes, I will. / No, I won't.</i><br>• <i>Where will you go at Tet? → I'll go to my grandparents' house.</i>"],

          [["Bạn sẽ gói bánh chưng vào dịp Tết chứ?","Will you make banh chung for Tet?"],["Chúng mình sẽ xem bắn pháo hoa.","We will watch the fireworks display."]]],

          ["<b>Hỏi hoạt động & đồ ăn trong ngày lễ:</b><br>• <i>What will you do on Children's Day? → We'll sing and dance.</i><br>• <i>What food/drinks will you have at the party? → We'll have pizza and milk tea.</i>"],
          [["We'll eat mooncakes at ______.",["Mid-Autumn Festival","Teachers' Day","Sports Day","New Year"],0,"Ăn bánh trung thu vào dịp 'Mid-Autumn Festival'."],["What food ______ you have at the party?",["will","are","did","does"],0,"Hỏi dự định tương lai dùng 'will'."],["Ngày Nhà giáo Việt Nam tiếng Anh là gì?",["Teachers' Day","Children's Day","Sports Day","Mother's Day"],0,"'Teachers' Day' là Ngày Nhà giáo."]],

          [["Bạn tập thể dục buổi sáng bao lâu một lần?","How often do you do morning exercise?"],["Mình chơi cầu lông ba lần một tuần.","I play badminton three times a week."]]],
        [15,2,"Our health","Sức khỏe của chúng ta","🤒","What's the matter? & You should/shouldn't","Bác Sĩ Tận Tâm","🩺",
          [["headache","/ˈhedeɪk/","(n)","đau đầu","I have a headache."],["toothache","/ˈtuːθeɪk/","(n)","đau răng","He has a toothache."],["sore throat","/ˌsɔː ˈθrəʊt/","(n)","đau họng","She has a sore throat."],["stomach ache","/ˈstʌmək eɪk/","(n)","đau bụng","I have a stomach ache."]],
          ["<b>Hỏi thăm khi bị ốm:</b> <i>What's the matter? → I have a toothache.</i>","<b>Đưa lời khuyên sức khỏe:</b> <i>You should go to the dentist. / You shouldn't eat lots of sweets.</i>"],
          [["What's the ______? → I have a sore throat.",["matter","name","time","weather"],0,"'What's the matter?' = Có chuyện gì vậy / Bạn bị làm sao thế?"],["You have a toothache. You ______ eat lots of sweets.",["shouldn't","should","can","will"],0,"Đau răng thì không nên ('shouldn't') ăn nhiều kẹo."],["Đau bụng trong tiếng Anh là gì?",["stomach ache","headache","toothache","earache"],0,"'stomach ache' là đau bụng."]],
          [["Bạn bị làm sao thế? Mình bị đau đầu.","What's the matter? I have a headache."],["Bạn nên đi khám nha sĩ.","You should go to the dentist."]]],
        [16,2,"Seasons and the weather","Các mùa và thời tiết","🍂","What's the weather like in...? & Clothes","Thần Bốn Mùa","❄️",

          ["<b>Thời tiết theo mùa:</b> <i>How's the weather in Ha Noi in winter? → It's cold.</i>","<b>Trang phục theo mùa:</b> <i>What do you usually wear in summer? → I wear a T-shirt and shorts.</i>"],
          [["Mùa thu trong tiếng Anh là gì?",["autumn","spring","summer","winter"],0,"'autumn' là mùa thu."],["How's the weather in winter? → It's ______.",["cold","hot","warm","sunny"],0,"Mùa đông trời lạnh ('cold')."],["What do you usually ______ in winter? → A warm coat.",["wear","eat","drink","play"],0,"'wear' nghĩa là mặc (quần áo)."]],
          [["Thời tiết mùa thu ở Hà Nội thế nào? Trời mát mẻ.","How's the weather in Ha Noi in autumn? It's cool."],["Mình thường mặc áo ấm vào mùa đông.","I usually wear a warm coat in winter."]]],
        [17,2,"Stories for children","Truyện kể cho thiếu nhi","📖","Who are the main characters? & How did he/she...","Người Kể Chuyện Cổ Tích","🧚",
          [["character","/ˈkærəktə/","(n)","nhân vật","Who are the main characters?"],["ant","/ænt/","(n)","con kiến","The ant worked hard."],["grasshopper","/ˈɡrɑːshɒpə/","(n)","con châu chấu","The grasshopper sang all day."],["crow","/krəʊ/","(n)","con quạ","The crow sang beautifully."]],
          ["<b>Hỏi về truyện cổ tích:</b><br>• <i>Who are the main characters in the story? → They're the fox and the crow.</i><br>• <i>How did he/she cook/sing/work? → He worked hard / She sang beautifully.</i>"],
          [["'grasshopper' có nghĩa là gì?",["con châu chấu","con kiến","con quạ","con cáo"],0,"'grasshopper' là con châu chấu."],["The ant worked very ______.",["hard","beautifully","loudly","sadly"],0,"Chú kiến làm việc rất chăm chỉ ('hard')."],["Who are the main ______ in the story?",["characters","subjects","seasons","buildings"],0,"'main characters' = các nhân vật chính."]],
          [["Ai là các nhân vật chính trong câu chuyện?","Who are the main characters in the story?"],["Con quạ đã hót rất hay.","The crow sang beautifully."]]],

          [["Dragon Bridge","/ˈdræɡən brɪdʒ/","(n)","Cầu Rồng","I want to visit Dragon Bridge."],["Ho Chi Minh City Museum","/ˈhəʊ tʃiː mɪn ˈsɪti mjuˈziːəm/","(n)","Bảo tàng TP.HCM","How can I get to the museum?"],["by taxi","/baɪ ˈtæksi/","(phr)","bằng xe taxi","You can get there by taxi."],["on foot","/ɒn fʊt/","(phr)","đi bộ","It's near, so you can go on foot."]],
          ["<b>Hỏi địa điểm muốn thăm & phương tiện:</b><br>• <i>Where do you want to visit? → I want to visit Ngo Mon Square.</i><br>• <i>How can I get there? → You can get there by bus / by bicycle / on foot.</i>"],
          [["Đi bộ tiếng Anh dùng cụm từ nào?",["on foot","by foot","in foot","at foot"],0,"Cụm từ cố định cho đi bộ là 'on foot'."],["How can I get there? → You can go ______ bus.",["by","on","in","with"],0,"Trước các phương tiện giao thông dùng 'by' (by bus, by taxi)."],["Where do you want ______ visit?",["to","in","at","on"],0,"'want to visit' = muốn đi thăm."]],
          [["Bạn muốn đi thăm nơi nào?","Where do you want to visit?"],["Bạn có thể đến đó bằng xe buýt.","You can get there by bus."]]],

          [["peaceful","/ˈpiːsfl/","(adj)","yên bình","Hoi An Old Town is peaceful."],["exciting","/ɪkˈsaɪtɪŋ/","(adj)","thú vị, náo nhiệt","Ho Chi Minh City is exciting."],["fantastic","/fænˈtæstɪk/","(adj)","tuyệt vời","The view is fantastic."],["kilometres","/ˈkɪləmiːtəz/","(n)","ki-lô-mét","It's about twenty kilometres."]],
          ["<b>Hỏi cảm nhận về địa điểm:</b> <i>What do you think of Ban Gioc Waterfall? → I think it's peaceful / fantastic.</i>","<b>Hỏi khoảng cách:</b> <i>How far is it from Ha Noi to Hoa Binh? → It's about 70 kilometres.</i>"],
          [["How ______ is it from here to Ha Long Bay? → About 150 kilometres.",["far","long","much","many"],0,"'How far is it...?' dùng để hỏi khoảng cách."],["What do you ______ of Phu Quoc Island? → I think it's fantastic.",["think","like","want","go"],0,"'What do you think of...?' = Bạn nghĩ gì về...?"],["'peaceful' có nghĩa là gì?",["yên bình","ồn ào","đắt đỏ","nguy hiểm"],0,"'peaceful' nghĩa là yên bình."]],
          [["Bạn nghĩ gì về Phố cổ Hội An?","What do you think of Hoi An Old Town?"],["Từ đây đến đó khoảng hai mươi ki-lô-mét.","It's about twenty kilometres from here to there."]]],

          [["Dam Sen Aquarium","/dæm sen əˈkweəriəm/","(n)","Thủy cung Đầm Sen","I'm going to visit Dam Sen Aquarium."],["Phong Nha Cave","/fɒŋ njɑː keɪv/","(n)","Động Phong Nha","We're going to visit Phong Nha Cave."],["go camping","/ɡəʊ ˈkæmpɪŋ/","(phr)","đi cắm trại","They're going to go camping."],["practise swimming","/ˈpræktɪs ˈswɪmɪŋ/","(phr)","luyện tập bơi","I'm going to practise swimming."]],

      // ==================== GRADE 6 (12 UNITS) ====================
      6: [
        [1,1,"My New School","Ngôi trường mới của tôi","🏫","Present Simple & Adverbs of Frequency","Thủ Lĩnh Trường Mới","🎒",
          [["uniform","/ˈjuːnɪfɔːm/","(n)","đồng phục","Students wear uniforms on Mondays."],["calculator","/ˈkælkjuleɪtə/","(n)","máy tính bỏ túi","I need a calculator for Maths."],["compass","/ˈkʌmpəs/","(n)","com-pa","Use a compass to draw a circle."],["boarding school","/ˈbɔːdɪŋ skuːl/","(n)","trường nội trú","They study and live at a boarding school."]],
          ["<b>1. Thì Hiện tại đơn (Present Simple):</b> Diễn tả thói quen, lịch trình cố định.<br><code>S + V(s/es)</code> (Với <i>he, she, it</i> thêm <i>-s/-es</i>).","<b>2. Vị trí trạng từ tần suất (always, usually, often, sometimes, rarely, never):</b><br>• Đứng <b>trước</b> động từ thường: <i>I <b>always</b> walk to school.</i><br>• Đứng <b>sau</b> động từ 'to be': <i>She is <b>never</b> late.</i>"],
          [["My new school ______ a large library and two computer rooms.",["has","have","is","having"],0,"'My new school' số ít nên chia động từ 'has'."],["Nam ______ goes to school on Sundays because his school is closed.",["never","always","usually","often"],0,"Chủ Nhật trường nghỉ nên Nam 'never' (không bao giờ) đi học."],["Trường nội trú trong tiếng Anh là gì?",["boarding school","secondary school","high school","primary school"],0,"'boarding school' là trường nội trú."]],
          [["Học sinh mặc đồng phục vào các ngày thứ Hai.","Students wear uniforms on Mondays."],["Cô ấy không bao giờ đi học muộn.","She is never late for school."]]],
        [2,1,"My House","Ngôi nhà của tôi","🏠","Possessive Case ('s) & Prepositions of Place","Kiến Trúc Sư Tài Ba","🛋️",
          [["chest of drawers","/ˌtʃest əv ˈdrɔːz/","(n)","tủ ngăn kéo","The lamp is on the chest of drawers."],["cupboard","/ˈkʌbəd/","(n)","tủ đựng chén bát/đồ","The plates are in the cupboard."],["dishwasher","/ˈdɪʃwɒʃə/","(n)","máy rửa bát","Our kitchen has a modern dishwasher."],["town house","/ˈtaʊn haʊs/","(n)","nhà phố","We live in a three-storey town house."]],
          ["<b>1. Sở hữu cách ('s):</b> Dùng để chỉ sự sở hữu của người/động vật.<br>• Danh từ số ít: <i>Nam's bedroom</i> (phòng ngủ của Nam).<br>• Danh từ số nhiều tận cùng là 's': <i>my parents' room</i>.","<b>2. Giới từ chỉ nơi chốn:</b> <i>in, on, under, behind, in front of, next to, between... and...</i>"],
          [["This is ______ bedroom. It is painted blue.",["Phong's","Phongs","Phong","Phong is"],0,"Sở hữu cách của danh từ riêng số ít: 'Phong's'."],["The sofa is ______ the TV and the bookshelf.",["between","next","in front","behind"],0,"Cấu trúc 'between A and B' (ở giữa A và B)."],["Máy rửa bát tiếng Anh là gì?",["dishwasher","fridge","cooker","wardrobe"],0,"'dishwasher' là máy rửa bát."]],
          [["Chiếc đèn ở trên tủ ngăn kéo.","The lamp is on the chest of drawers."],["Đây là phòng ngủ của chị gái tôi.","This is my sister's bedroom."]]],
        [3,1,"My Friends","Những người bạn của tôi","🧑‍🤝‍🧑","Present Continuous (Actions now & Plans)","Người Bạn Tri Kỷ","🌟",
          [["confident","/ˈkɒnfɪdənt/","(adj)","tự tin","Minh is confident when speaking English."],["hard-working","/ˌhɑːd ˈwɜːkɪŋ/","(adj)","chăm chỉ","She is a hard-working student."],["creative","/kriˈeɪtɪv/","(adj)","sáng tạo","My best friend is very creative."],["caring","/ˈkeərɪŋ/","(adj)","chu đáo, biết quan tâm","Lan is kind and caring."]],
          ["<b>Thì Hiện tại tiếp diễn (Present Continuous):</b><br><code>S + am/is/are + V-ing</code><br>• Dùng để diễn tả hành động <b>đang xảy ra</b> tại thời điểm nói (<i>now, at the moment, Look!, Listen!</i>).<br>• VD: <i>Look! The students <b>are playing</b> football in the yard.</i>"],
          [["Listen! Someone ______ the guitar in the music room.",["is playing","plays","play","are playing"],0,"Có từ cảm thán 'Listen!' -> chia Hiện tại tiếp diễn 'is playing'."],["A person who always works with a lot of effort is ______.",["hard-working","shy","talkative","lazy"],0,"'hard-working' nghĩa là chăm chỉ."],["What ______ you ______ at the moment?",["are / doing","do / do","is / doing","did / do"],0,"'at the moment' -> Hiện tại tiếp diễn: 'are you doing'."]],
          [["Nhìn kìa! Các bạn học sinh đang chơi bóng đá.","Look! The students are playing football."],["Bạn thân của tôi rất tự tin và sáng tạo.","My best friend is very confident and creative."]]],
        [4,1,"My Neighbourhood","Khu phố của tôi","🏘️","Comparative Adjectives (So sánh hơn)","Thị Trưởng Khu Phố","🗺️",
          [["convenient","/kənˈviːniənt/","(adj)","thuận tiện, tiện lợi","Living near a supermarket is very convenient."],["peaceful","/ˈpiːsfl/","(adj)","yên bình","The countryside is more peaceful than the city."],["historic","/hɪˈstɒrɪk/","(adj)","cổ kính, thuộc lịch sử","Hoi An is a historic town."],["square","/skweə/","(n)","quảng trường","People gather at the central square."]],
          ["<b>So sánh hơn của Tính từ (Comparative Adjectives):</b><br>• <b>Tính từ ngắn (1 âm tiết):</b> <code>adj-er + than</code> (<i>bigger, noisier, hotter</i>).<br>• <b>Tính từ dài (từ 2 âm tiết trở lên):</b> <code>more + adj + than</code> (<i>more modern, more peaceful</i>).<br>• <b>Bất quy tắc:</b> <i>good → better, bad → worse</i>."],
          [["Life in the countryside is ______ than life in a big city.",["more peaceful","peacefuler","most peaceful","peaceful"],0,"'peaceful' là tính từ dài -> so sánh hơn dùng 'more peaceful than'."],["This street is ______ than that one because of heavy traffic.",["noisier","more noisy","noisiest","noisy"],0,"Tính từ 2 âm tiết tận cùng bằng '-y' (noisy) đổi thành '-ier' -> 'noisier'."],["Your new house is ______ than your old one.",["bigger","more big","biggest","biger"],0,"'big' gấp đôi phụ âm cuối thành 'bigger'."]],
          [["Cuộc sống ở đây thuận tiện hơn ở ngôi làng cũ.","Life here is more convenient than in the old village."],["Quảng trường này rộng hơn quảng trường kia.","This square is wider than that square."]]],
        [5,1,"Natural Wonders of Viet Nam","Kỳ quan thiên nhiên Việt Nam","🏝️","Countable/Uncountable Nouns & Must/Mustn't","Hộ Vệ Kỳ Quan","⛰️",
          [["waterfall","/ˈwɔːtəfɔːl/","(n)","thác nước","Ban Gioc is a magnificent waterfall."],["cave","/keɪv/","(n)","hang động","Son Doong is the largest cave in the world."],["desert","/ˈdezət/","(n)","sa mạc","Mui Ne has famous red sand dunes like a desert."],["backpack","/ˈbækpæk/","(n)","ba lô","Put your suncream and water in your backpack."]],
          ["<b>1. Danh từ đếm được & không đếm được:</b><br>• <i>many / a few</i> + danh từ đếm được số nhiều (<i>many islands</i>).<br>• <i>much / a little</i> + danh từ không đếm được (<i>much water, a little suncream</i>).","<b>2. Động từ khuyết thiếu must / mustn't:</b><br>• <i>must + V</i>: bắt buộc phải làm.<br>• <i>mustn't + V</i>: nghiêm cấm không được làm."],
          [["You ______ litter when visiting natural wonders.",["mustn't","must","should","can"],0,"'mustn't litter' = nghiêm cấm xả rác bừa bãi."],["How ______ water should we bring for the mountain hike?",["much","many","few","a"],0,"'water' là danh từ không đếm được -> dùng 'How much'."],["Hang động lớn nhất thế giới ở Quảng Bình là gì?",["Son Doong Cave","Phong Nha Cave","Huong Pagoda","Ha Long Bay"],0,"Hang Sơn Đoòng ('Son Doong Cave') là hang động tự nhiên lớn nhất thế giới."]],
          [["Bạn không được xả rác trong vườn quốc gia.","You mustn't litter in the national park."],["Chúng ta cần mang theo một ít kem chống nắng.","We need to bring a little suncream."]]],
        [6,1,"Our Tet Holiday","Ngày Tết của chúng ta","🧧","Should/Shouldn't & Some/Any","Đại Sứ Ngày Tết","🏮",
          [["wish","/wɪʃ/","(n/v)","điều ước / chúc","Children wish their grandparents good health."],["fireworks","/ˈfaɪəwɜːks/","(n)","pháo hoa","We watch colourful fireworks on New Year's Eve."],["furniture","/ˈfɜːnɪtʃə/","(n)","đồ đạc trong nhà","My family cleans the furniture before Tet."],["lucky money","/ˈlʌki ˈmʌni/","(n)","tiền lì xì","Kids love receiving lucky money in red envelopes."]],
          ["<b>1. Lời khuyên với Should / Shouldn't:</b><br>• <i>We <b>should</b> help our parents clean the house.</i><br>• <i>We <b>shouldn't</b> break things at Tet.</i>","<b>2. Some & Any:</b><br>• <b>some:</b> dùng trong câu khẳng định & lời mời (<i>some apricot blossoms</i>).<br>• <b>any:</b> dùng trong câu phủ định & nghi vấn (<i>any fireworks</i>)."],
          [["At Tet, children ______ greet their elders politely.",["should","shouldn't","mustn't","aren't"],0,"Dùng 'should' (nên) để chỉ hành động đẹp ngày Tết."],["Are there ______ peach blossoms in your living room?",["any","some","a","an"],0,"Trong câu hỏi dùng 'any'."],["Đồ nội thất trong nhà tiếng Anh là gì?",["furniture","fireworks","envelope","decoration"],0,"'furniture' là đồ đạc, nội thất."]],
          [["Chúng ta nên chúc ông bà sức khỏe dồi dào.","We should wish our grandparents good health."],["Chúng ta không nên làm vỡ đồ đạc vào ngày Tết.","We shouldn't break things at Tet."]]],
        [7,2,"Television","Truyền hình","📺","Wh-question words & Conjunctions (and, but, so)","Biên Tập Viên Truyền Hình","🎬",
          [["cartoon","/kɑːˈtuːn/","(n)","phim hoạt hình","Children love watching animated cartoons."],["documentary","/ˌdɒkjuˈmentri/","(n)","phim tài liệu","This documentary is about wild animals."],["channel","/ˈtʃænl/","(n)","kênh truyền hình","What channel is the game show on?"],["educational","/ˌedʒuˈkeɪʃənl/","(adj)","mang tính giáo dục","That quiz show is very educational."]],
          ["<b>1. Từ để hỏi (Wh-questions):</b> <i>What, Where, When, Who, Why, How often</i>.","<b>2. Liên từ nối câu ghép:</b><br>• <b>and:</b> thêm ý (và)<br>• <b>but:</b> tương phản (nhưng)<br>• <b>so:</b> chỉ kết quả (vì vậy, nên)"],
          [["______ do you watch the news? → Every evening.",["How often","How many","Where","Who"],0,"Hỏi tần suất (Every evening) dùng 'How often'."],["The comedy was very funny, ______ I laughed a lot.",["so","but","although","because"],0,"Vế sau là kết quả của vế trước -> dùng 'so' (vì vậy)."],["Phim tài liệu trong tiếng Anh là gì?",["documentary","cartoon","comedy","talent show"],0,"'documentary' là phim tài liệu."]],
          [["Chương trình đố vui này rất mang tính giáo dục.","This quiz show is very educational."],["Tôi thích xem phim hoạt hình nhưng em trai tôi thích thể thao.","I like cartoons, but my brother likes sports."]]],
        [8,2,"Sports and Games","Thể thao và trò chơi","🏅","Past Simple & Imperatives","Nhà Vô Địch Olympic","🏆",
          [["marathon","/ˈmærəθən/","(n)","cuộc đua ma-ra-tông","Thousands of runners joined the city marathon."],["racket","/ˈrækɪt/","(n)","cái vợt (cầu lông/tennis)","Don't forget your badminton racket."],["champion","/ˈtʃæmpiən/","(n)","nhà vô địch","She became the world chess champion."],["congratulations","/kənˌɡrætʃuˈleɪʃnz/","(n)","lời chúc mừng","Congratulations on winning the match!"]],
          ["<b>1. Thì Quá khứ đơn (Past Simple):</b> Diễn tả sự việc đã xảy ra và kết thúc trong quá khứ (<i>yesterday, last week, ago, in 2020</i>).<br><code>S + V2/ed</code> | Phủ định: <code>S + didn't + V-inf</code>.","<b>2. Câu mệnh lệnh (Imperatives):</b> <i>Do more exercise! / Don't play video games too much!</i>"],
          [["Our school football team ______ the match last Sunday.",["won","win","wins","winning"],0,"'last Sunday' là quá khứ đơn -> quá khứ của 'win' là 'won'."],["______ your racket when you go to the tennis court.",["Bring","Brings","Bringing","To bring"],0,"Câu mệnh lệnh khẳng định bắt đầu bằng động từ nguyên thể 'Bring'."],["Cái vợt cầu lông tiếng Anh là gì?",["racket","goggles","ball","helmet"],0,"'racket' là cái vợt."]],
          [["Đội của chúng tôi đã chiến thắng trận đấu hôm qua.","Our team won the match yesterday."],["Đừng chơi trò chơi điện tử quá nhiều!","Don't play video games too much!"]]],
        [9,2,"Cities of the World","Các thành phố trên thế giới","🗼","Possessive Pronouns & What a/an + adj + N!","Du Khách Vòng Quanh Thế Giới","🌍",
          [["landmark","/ˈlændmɑːk/","(n)","địa danh nổi tiếng","Big Ben is a famous landmark in London."],["crowded","/ˈkraʊdɪd/","(adj)","đông đúc","Tokyo is a modern and crowded city."],["floating market","/ˈfləʊtɪŋ ˈmɑːkɪt/","(n)","chợ nổi","Can Tho is famous for its floating market."],["street food","/ˈstriːt fuːd/","(n)","ẩm thực đường phố","Vietnamese street food is delicious."]],
          ["<b>1. Đại từ sở hữu (Possessive Pronouns):</b> Thay thế cho <i>Tính từ sở hữu + Danh từ</i>.<br><i>mine, yours, his, hers, ours, theirs</i>.<br>(VD: <i>This is my map. Where is <b>yours</b>?</i>)","<b>2. Câu cảm thán:</b> <code>What + (a/an) + adj + N!</code><br>(VD: <i>What a nice city! / What delicious food!</i>)"],
          [["This is our hotel, and that one over there is ______.",["theirs","their","them","they"],0,"Đại từ sở hữu thay cho 'their hotel' là 'theirs'."],["______ a beautiful landmark!",["What","How","Which","Where"],0,"Cấu trúc câu cảm thán với danh từ: 'What + a/an + adj + N!'."],["Địa danh nổi tiếng biểu tượng của một thành phố gọi là gì?",["landmark","suburb","alley","factory"],0,"'landmark' là địa danh nổi tiếng."]],
          [["Chợ nổi là một nét đặc trưng nổi tiếng ở Cần Thơ.","The floating market is a famous feature in Can Tho."],["Thật là một thành phố tuyệt đẹp!","What a beautiful city!"]]],
        [10,2,"Our Houses in the Future","Ngôi nhà tương lai của chúng ta","🛸","Future Simple (will) & Might for Possibility","Kiến Trúc Sư Vũ Trụ","🤖",
          [["appliance","/əˈplaɪəns/","(n)","thiết bị gia dụng","Smart appliances help us do housework."],["wireless","/ˈwaɪələs/","(adj)","không dây","We will have a wireless TV in every room."],["solar energy","/ˈsəʊlər ˈenədʒi/","(n)","năng lượng mặt trời","Our future house will run on solar energy."],["surround","/səˈraʊnd/","(v)","bao quanh","Tall trees will surround my dream house."]],
          ["<b>1. Thì Tương lai đơn (will):</b> Diễn tả dự đoán hoặc việc sẽ làm trong tương lai.<br><code>S + will / won't + V-inf</code>","<b>2. Might + V-inf:</b> Diễn tả khả năng có thể xảy ra trong tương lai (không chắc chắn 100%).<br>(VD: <i>Robots <b>might</b> cook our meals in the future.</i>)"],
          [["In the future, robots ______ help us clean the floors.",["will","did","are","were"],0,"'In the future' -> dùng thì tương lai đơn 'will'."],["We ______ live on the Moon one day, but I'm not sure.",["might","must","did","have"],0,"Diễn tả khả năng chưa chắc chắn ('not sure') dùng 'might'."],["Năng lượng mặt trời tiếng Anh là gì?",["solar energy","wind power","nuclear energy","coal"],0,"'solar energy' là năng lượng mặt trời."]],
          [["Ngôi nhà tương lai của tôi sẽ sử dụng năng lượng mặt trời.","My future house will use solar energy."],["Robot có thể sẽ giúp chúng ta làm việc nhà.","Robots might help us do housework."]]],
        [11,2,"Our Greener World","Thế giới xanh hơn của chúng ta","♻️","Articles (a/an/the) & 1st Conditional","Hiệp Sĩ Môi Trường","🌱",
          [["reusable","/ˌriːˈjuːzəbl/","(adj)","có thể tái sử dụng","Bring a reusable bag when shopping."],["recycle","/ˌriːˈsaɪkl/","(v)","tái chế","We should recycle plastic bottles and paper."],["rubbish","/ˈrʌbɪʃ/","(n)","rác thải","Put your rubbish in the recycling bin."],["deforestation","/ˌdiːˌfɒrɪˈsteɪʃn/","(n)","nạn phá rừng","Deforestation harms wild animals."]],
          ["<b>1. Câu điều kiện loại 1 (First Conditional):</b> Diễn tả điều kiện có thật ở hiện tại/tương lai.<br><code>If + S + V(hiện tại đơn), S + will/won't + V-inf</code><br>(VD: <i>If we <b>plant</b> more trees, the air <b>will be</b> fresher.</i>)","<b>2. Mạo từ:</b> <i>a/an</i> (lần đầu nhắc đến), <i>the</i> (đã xác định / duy nhất như <i>the Earth, the Sun</i>)."],
          [["If we ______ plastic bags, we will help protect the environment.",["reduce","reduced","will reduce","reducing"],0,"Mệnh đề If của câu điều kiện loại 1 chia thì hiện tại đơn: 'reduce'."],["______ Earth is the third planet from the Sun.",["The","A","An","No article"],0,"'Earth' là duy nhất nên dùng mạo từ 'The'."],["Từ nào có nghĩa là 'tái chế'?",["recycle","reduce","reuse","throw"],0,"'recycle' nghĩa là tái chế."]],
          [["Nếu chúng ta trồng nhiều cây hơn, không khí sẽ trong lành hơn.","If we plant more trees, the air will be fresher."],["Hãy mang theo túi tái sử dụng khi đi mua sắm.","Bring a reusable bag when going shopping."]]],
        [12,2,"Robots","Người máy","🤖","Superlative Adjectives (So sánh nhất)","Kỹ Sư Chế Tạo Robot","🦾",
          [["repair","/rɪˈpeə/","(v)","sửa chữa","This robot can repair broken machines."],["guard","/ɡɑːd/","(v/n)","bảo vệ / lính gác","A security robot can guard our house at night."],["helpful","/ˈhelpfl/","(adj)","hữu ích","Home robots are very helpful for busy families."],["planet","/ˈplænɪt/","(n)","hành tinh","Space robots can explore other planets."]],
          ["<b>So sánh nhất của Tính từ (Superlative Adjectives):</b><br>• <b>Tính từ ngắn:</b> <code>the + adj-est</code> (<i>the tallest, the fastest, the smartest</i>).<br>• <b>Tính từ dài:</b> <code>the most + adj</code> (<i>the most useful, the most expensive</i>).<br>• <b>Bất quy tắc:</b> <i>good → the best, bad → the worst</i>."],
          [["This is ______ robot in the science exhibition.",["the smartest","smarter","the most smart","smartest"],0,"'smart' là tính từ ngắn -> so sánh nhất là 'the smartest'."],["I think home robots are ______ useful machines for housework.",["the most","more","most","the"],0,"'useful' là tính từ dài -> so sánh nhất dùng 'the most useful'."],["Động từ nào có nghĩa là 'sửa chữa'?",["repair","guard","break","destroy"],0,"'repair' nghĩa là sửa chữa."]],
          [["Đây là chú robot thông minh nhất trong cuộc thi.","This is the smartest robot in the competition."],["Robot không gian có thể khám phá các hành tinh khác.","Space robots can explore other planets."]]]

      // ==================== GRADE 7 (12 UNITS) ====================
      7: [
        [1,1,"Hobbies","Sở thích","🎨","Present Simple & Verbs of Liking + V-ing","Bậc Thầy Đam Mê","🧩",
          [["collect coins","/kəˈlekt kɔɪnz/","(phr)","sưu tầm tiền xu","My brother loves collecting coins."],["gardening","/ˈɡɑːdnɪŋ/","(n)","làm vườn","Gardening is a relaxing outdoor hobby."],["horse riding","/ˈhɔːs raɪdɪŋ/","(n)","cưỡi ngựa","Horse riding requires balance and courage."],["cardboard","/ˈkɑːdbɔːd/","(n)","bìa các-tông","She makes dollhouses from cardboard."]],
          ["<b>1. Động từ chỉ sự yêu/ghét + V-ing:</b><br><i>love, like, enjoy, hate + V-ing</i><br>(VD: <i>I <b>enjoy making</b> models in my free time.</i>)","<b>2. Thì Hiện tại đơn:</b> Dùng cho sở thích, thói quen lâu dài và sự thật hiển nhiên (<i>The sun rises in the east</i>)."],
          [["My sister enjoys ______ yoga every morning to stay fit.",["doing","do","to do","does"],0,"Sau 'enjoy' luôn dùng động từ đuôi '-ing': 'doing'."],["Making models develops your ______ and patience.",["creativity","creative","create","created"],0,"Sau tính từ sở hữu 'your' cần một danh từ: 'creativity' (sự sáng tạo)."],["Bìa các-tông tiếng Anh là gì?",["cardboard","wood","plastic","glass"],0,"'cardboard' là bìa các-tông."]],
          [["Anh trai tôi thích sưu tầm tiền xu vào thời gian rảnh.","My brother loves collecting coins in his free time."],["Làm vườn là một sở thích ngoài trời rất thư giãn.","Gardening is a very relaxing outdoor hobby."]]],
        [2,1,"Healthy Living","Sống khỏe","🥗","Simple Sentences (Câu đơn)","Chiến Binh Sức Khỏe","💪",
          [["acne","/ˈækni/","(n)","mụn trứng cá","Wash your face regularly to prevent acne."],["sunburn","/ˈsʌnbɜːn/","(n)","cháy nắng","Wear a hat and suncream to avoid sunburn."],["chapped lips","/tʃæpt lɪps/","(n)","môi nứt nẻ","Use lip balm when you have chapped lips."],["protein","/ˈprəʊtiːn/","(n)","chất đạm","Fish, eggs, and tofu provide lots of protein."]],
          ["<b>Câu đơn (Simple Sentences):</b> Gồm một mệnh đề độc lập (1 Chủ ngữ + 1 Vị ngữ), có thể có chủ ngữ ghép hoặc động từ ghép.<br>• <i>Japanese people <b>eat</b> a lot of fish and tofu.</i><br>• <i><b>Vegetables and fruit</b> give us vitamins.</i>"],
          [["To avoid ______, you should wear a sunhat when going out at noon.",["sunburn","acne","toothache","flu"],0,"'sunburn' nghĩa là bị cháy nắng."],["Which of the following is a simple sentence?",["We eat vegetables and exercise every day.","We eat vegetables, and we exercise.","If you exercise, you stay fit.","Although it rained, we ran."],0,"Câu A chỉ có 1 chủ ngữ 'We' với động từ ghép 'eat ... and exercise', là câu đơn."],["'chapped lips' có nghĩa là gì?",["môi nứt nẻ","cháy nắng","mụn trứng cá","đau họng"],0,"'chapped lips' là môi nứt nẻ."]],
          [["Người Nhật ăn nhiều cá và đậu phụ.","Japanese people eat a lot of fish and tofu."],["Hãy thoa kem chống nắng để tránh bị cháy nắng.","Use suncream to avoid sunburn."]]],
        [3,1,"Community Service","Hoạt động phục vụ cộng đồng","🤝","Past Simple (Regular & Irregular Verbs)","Trái Tim Nhân Ái","❤️",
          [["donate","/dəʊˈneɪt/","(v)","quyên góp, hiến tặng","Students donated old books to rural children."],["nursing home","/ˈnɜːsɪŋ həʊm/","(n)","viện dưỡng lão","We visited and sang for the elderly at a nursing home."],["tutor","/ˈtjuːtə/","(v/n)","dạy kèm / gia sư","Volunteering to tutor primary kids is meaningful."],["homeless","/ˈhəʊmləs/","(adj)","vô gia cư","The charity provides warm meals for homeless people."]],
          ["<b>Thì Quá khứ đơn (Past Simple):</b><br>• Động từ có quy tắc: <code>V-ed</code> (<i>donated, helped, planted, cleaned</i>).<br>• Động từ bất quy tắc: <i>give → gave, buy → bought, teach → taught, build → built</i>.<br>• Dấu hiệu: <i>yesterday, last week/month, ... ago, in 2022</i>."],
          [["Last summer, our club ______ warm clothes to mountainous children.",["donated","donate","donates","donating"],0,"'Last summer' là dấu hiệu quá khứ đơn -> dùng 'donated'."],["A place where elderly people live and are cared for is a ______.",["nursing home","orphanage","boarding school","stadium"],0,"'nursing home' là viện dưỡng lão."],["We ______ plastic bottles around the park two days ago.",["picked up","pick up","picking up","picks up"],0,"'two days ago' -> chia quá khứ đơn 'picked up'."]],
          [["Chúng tôi đã quyên góp sách cũ cho trẻ em vùng cao.","We donated old books to children in mountainous areas."],["Các tình nguyện viên đã giúp đỡ người cao tuổi ở viện dưỡng lão.","Volunteers helped the elderly at the nursing home."]]],
        [4,1,"Music and Arts","Âm nhạc và Mỹ thuật","🎶","Comparisons: like, different from, (not) as...as","Nhạc Sĩ Tài Hoa","🎻",
          [["puppetry","/ˈpʌpɪtri/","(n)","nghệ thuật múa rối","Water puppetry is a unique Vietnamese art form."],["composer","/kəmˈpəʊzə/","(n)","nhà soạn nhạc","Trinh Cong Son is a famous Vietnamese composer."],["portrait","/ˈpɔːtrət/","(n)","tranh chân dung","The artist painted a portrait of his mother."],["exhibition","/ˌeksɪˈbɪʃn/","(n)","cuộc triển lãm","We went to an art exhibition at the museum."]],
          ["<b>Cấu trúc so sánh:</b><br>• <code>like + N</code>: giống như (<i>He sings <b>like</b> a professional singer.</i>)<br>• <code>different from + N</code>: khác với (<i>City life is <b>different from</b> country life.</i>)<br>• <code>(not) as + adj/adv + as</code>: (không) ... bằng (<i>This film is <b>not as interesting as</b> the book.</i>)"],
          [["Water puppetry is completely ______ from modern pop concerts.",["different","like","same","as"],0,"Cấu trúc 'different from' = khác với."],["This painting is ______ expensive as the one we saw yesterday.",["as","like","than","more"],0,"So sánh ngang bằng: 'as + adj + as'."],["Người sáng tác nhạc được gọi là gì?",["composer","painter","actor","sculptor"],0,"'composer' là nhà soạn nhạc."]],
          [["Múa rối nước là một loại hình nghệ thuật truyền thống độc đáo.","Water puppetry is a unique traditional art form."],["Bức tranh chân dung này đẹp như bức tranh kia.","This portrait is as beautiful as that one."]]],
        [5,1,"Food and Drink","Đồ ăn và thức uống","🍜","Some, a lot of, lots of & How much / How many","Siêu Đầu Bếp Việt","🍲",
          [["ingredient","/ɪnˈɡriːdiənt/","(n)","nguyên liệu, thành phần","Fresh herbs are a key ingredient in Pho."],["recipe","/ˈresəpi/","(n)","công thức nấu ăn","My grandmother gave me her secret recipe."],["broth","/brɒθ/","(n)","nước dùng, nước lèo","Beef noodle soup has a rich and fragrant broth."],["tablespoon","/ˈteɪblspuːn/","(n)","thìa canh","Add two tablespoons of fish sauce."]],
          ["<b>1. Lượng từ:</b><br>• <i>some</i>: một vài/một ít (câu khẳng định & lời mời).<br>• <i>a lot of / lots of</i>: nhiều (dùng cho cả danh từ đếm được và không đếm được).","<b>2. Hỏi số lượng:</b><br>• <code>How many + N(đếm được số nhiều)</code> (<i>How many eggs?</i>)<br>• <code>How much + N(không đếm được)</code> (<i>How much sugar?</i>)"],
          [["How ______ bottles of cooking oil do we have in the kitchen?",["many","much","some","any"],0,"'bottles' là danh từ đếm được số nhiều -> dùng 'How many'."],["There is ______ of rice left in the pot.",["a lot","many","a few","few"],0,"'rice' không đếm được -> dùng 'a lot of'."],["Nước dùng của món phở tiếng Anh là gì?",["broth","recipe","flour","butter"],0,"'broth' là nước dùng, nước lèo."]],
          [["Bạn cần bao nhiêu nguyên liệu cho công thức này?","How many ingredients do you need for this recipe?"],["Nước dùng phở bò rất đậm đà và thơm ngon.","Beef noodle soup broth is very rich and delicious."]]],
        [6,1,"A Visit to a School","Chuyến thăm một ngôi trường","🏛️","Prepositions of Time & Place (in, on, at)","Học Giả Quốc Tử Giám","📜",
          [["entrance exam","/ˈentrəns ɪɡzæm/","(n)","kỳ thi tuyển sinh","Students study hard to pass the entrance exam."],["gifted","/ˈɡɪftɪd/","(adj)","có năng khiếu, chuyên","She studies at a high school for gifted students."],["midterm","/ˈmɪdtɜːm/","(adj/n)","giữa kỳ","Our midterm tests take place in November."],["laboratory","/ləˈbɒrətri/","(n)","phòng thí nghiệm","Students do science experiments in the laboratory."]],
          ["<b>Giới từ chỉ thời gian & nơi chốn (in, on, at):</b><br>• <b>at:</b> giờ giấc (<i>at 7 AM</i>), địa điểm cụ thể (<i>at school, at the entrance</i>).<br>• <b>on:</b> ngày, thứ (<i>on Monday, on September 5th</i>), bề mặt (<i>on the second floor</i>).<br>• <b>in:</b> tháng, năm, mùa (<i>in 2026, in May</i>), không gian bao quanh (<i>in the classroom</i>)."],
          [["The school year in Viet Nam usually begins ______ September 5th.",["on","in","at","by"],0,"Có ngày cụ thể (September 5th) -> dùng giới từ 'on'."],["Students do chemistry experiments ______ the school laboratory.",["in","on","at","to"],0,"Bên trong một căn phòng -> dùng 'in'."],["Trường chuyên dành cho học sinh năng khiếu gọi là gì?",["school for gifted students","boarding school","primary school","kindergarten"],0,"'gifted students' = học sinh năng khiếu/học sinh chuyên."]],
          [["Kỳ thi giữa kỳ của chúng tôi diễn ra vào tháng Mười Một.","Our midterm exams take place in November."],["Học sinh làm thí nghiệm khoa học trong phòng thí nghiệm.","Students do science experiments in the laboratory."]]],
        [7,2,"Traffic","Giao thông","🚦","It indicating distance & Should/Shouldn't","Đại Sứ An Toàn Giao Thông","🚸",
          [["pedestrian","/pəˈdestriən/","(n)","người đi bộ","Pedestrians must cross the street at the zebra crossing."],["helmet","/ˈhelmɪt/","(n)","mũ bảo hiểm","Always wear a helmet when riding a motorbike."],["traffic jam","/ˈtræfɪk dʒæm/","(n)","tắc đường","There is a heavy traffic jam during rush hour."],["seatbelt","/ˈsiːtbelt/","(n)","dây an toàn","Fasten your seatbelt when sitting in a car."]],
          ["<b>1. Cấu trúc 'It' chỉ khoảng cách:</b><br><code>It is (about) + khoảng cách + from A to B.</code><br>(VD: <i><b>It is</b> about 2 kilometres <b>from</b> my house <b>to</b> school.</i>)","<b>2. Luật lệ giao thông với Should / Shouldn't:</b><br><i>You <b>should</b> obey traffic rules. / You <b>shouldn't</b> ride your bike too fast.</i>"],
          [["______ is about three kilometres from my home to the nearest bus stop.",["It","There","This","That"],0,"Dùng chủ ngữ giả 'It' để chỉ khoảng cách: 'It is about...'."],["You ______ fasten your seatbelt whenever you get into a car.",["should","shouldn't","mustn't","can't"],0,"Thắt dây an toàn là việc nên làm -> 'should'."],["Người đi bộ trong tiếng Anh là gì?",["pedestrian","cyclist","motorist","passenger"],0,"'pedestrian' là người đi bộ."]],
          [["Từ nhà tôi đến trường khoảng hai ki-lô-mét.","It is about two kilometres from my house to school."],["Người đi bộ phải sang đường ở vạch kẻ đường.","Pedestrians must cross the street at the zebra crossing."]]],
        [8,2,"Films","Phim ảnh","🎬","Although/Though & However","Nhà Phê Bình Điện Ảnh","🍿",
          [["gripping","/ˈɡrɪpɪŋ/","(adj)","hấp dẫn, lôi cuốn","The sci-fi film was so gripping that I couldn't stop watching."],["hilarious","/hɪˈleəriəs/","(adj)","vui nhộn, hài hước","We laughed a lot because the comedy was hilarious."],["documentary","/ˌdɒkjuˈmentri/","(n)","phim tài liệu","The documentary shows the life of ocean creatures."],["review","/rɪˈvjuː/","(n)","bài đánh giá, phê bình","The film received positive reviews from critics."]],
          ["<b>1. Although / Though + Mệnh đề:</b> Mặc dù... (nối 2 vế tương phản, không dùng 'but' trong cùng câu).<br>(VD: <i><b>Although</b> the plot was simple, the acting was amazing.</i>)","<b>2. However (Tuy nhiên):</b> Đứng đầu câu thứ hai (sau dấu chấm hoặc dấu chấm phẩy) và <b>có dấu phẩy (,) theo sau</b>.<br>(VD: <i>The tickets were expensive. <b>However,</b> the cinema was full.</i>)"],
          [["______ the film had a small budget, it became a huge success.",["Although","However","Because","So"],0,"Đứng đầu câu nối hai mệnh đề tương phản -> dùng 'Although'."],["The movie was quite frightening. ______, my little brother enjoyed it.",["However","Although","Though","Because"],0,"Đứng sau dấu chấm và có dấu phẩy theo sau -> dùng 'However'."],["Tính từ nào miêu tả bộ phim cực kỳ lôi cuốn, hấp dẫn?",["gripping","dull","boring","predictable"],0,"'gripping' nghĩa là hấp dẫn, cuốn hút."]],
          [["Mặc dù cốt truyện đơn giản nhưng diễn xuất rất tuyệt vời.","Although the plot was simple, the acting was amazing."],["Bộ phim rất hài hước và nhận được nhiều đánh giá tích cực.","The film was hilarious and received positive reviews."]]],
        [9,2,"Festivals around the World","Lễ hội trên thế giới","🎭","Yes/No Questions (Trợ động từ & Động từ khuyết thiếu)","Sứ Giả Lễ Hội","🎆",
          [["parade","/pəˈreɪd/","(n)","cuộc diễu hành","People watched the colourful carnival parade."],["costume","/ˈkɒstjuːm/","(n)","trang phục hóa trang","Dancers wore traditional costumes at the festival."],["feast","/fiːst/","(n)","bữa tiệc lớn","Families prepare a big feast for Thanksgiving."],["symbol","/ˈsɪmbl/","(n)","biểu tượng","The golden lion is a symbol of strength."]],
          ["<b>Câu hỏi Yes/No (Yes/No Questions):</b> Đảo trợ động từ (<i>Do/Does/Did</i>), động từ <i>to be (Am/Is/Are/Was/Were)</i> hoặc động từ khuyết thiếu (<i>Can/Will/Should</i>) lên đầu câu.<br>• <i><b>Did</b> you attend the Tulip Festival last year? → Yes, I <b>did</b>.</i><br>• <i><b>Are</b> they performing folk dances? → Yes, they <b>are</b>.</i>"],
          [["______ people throw tomatoes at each other during La Tomatina?",["Do","Are","Is","Does"],0,"Động từ thường 'throw' ở hiện tại với chủ ngữ số nhiều 'people' -> dùng trợ động từ 'Do'."],["Did she wear a traditional costume? → Yes, she ______.",["did","was","does","can"],0,"Câu hỏi bắt đầu bằng 'Did' thì trả lời bằng 'did'."],["Cuộc diễu hành đường phố tiếng Anh là gì?",["parade","feast","symbol","lantern"],0,"'parade' là cuộc diễu hành."]],
          [["Họ đã mặc trang phục truyền thống tại lễ hội phải không?","Did they wear traditional costumes at the festival?"],["Mọi người xem cuộc diễu hành đầy màu sắc.","People watched the colourful parade."]]],
        [10,2,"Energy Sources","Các nguồn năng lượng","⚡","Present Continuous (Ongoing actions)","Chuyên Gia Năng Lượng Xanh","☀️",
          [["renewable","/rɪˈnjuːəbl/","(adj)","có thể tái tạo","Solar and wind power are renewable energy sources."],["non-renewable","/ˌnɒn rɪˈnjuːəbl/","(adj)","không thể tái tạo","Coal, oil, and natural gas are non-renewable."],["solar panel","/ˈsəʊlə ˈpænl/","(n)","tấm pin mặt trời","We installed solar panels on our roof."],["nuclear","/ˈnjuːkliə/","(adj)","hạt nhân","Nuclear energy produces a lot of electricity."]],
          ["<b>Thì Hiện tại tiếp diễn (Present Continuous):</b> Diễn tả hành động đang diễn ra ngay lúc nói hoặc xu hướng đang diễn ra xung quanh hiện tại.<br>(VD: <i>Scientists <b>are developing</b> cleaner energy sources nowadays.</i>)"],
          [["Coal and natural gas are ______ energy sources because they will run out.",["non-renewable","renewable","unlimited","solar"],0,"Than đá và khí tự nhiên sẽ cạn kiệt nên là 'non-renewable' (không tái tạo)."],["Look! The workers ______ solar panels on the school roof.",["are installing","install","installed","installs"],0,"Có 'Look!' -> chia Hiện tại tiếp diễn 'are installing'."],["Tấm pin năng lượng mặt trời tiếng Anh là gì?",["solar panel","wind turbine","hydro power","light bulb"],0,"'solar panel' là tấm pin mặt trời."]],
          [["Năng lượng mặt trời và gió là các nguồn năng lượng tái tạo.","Solar and wind power are renewable energy sources."],["Các công nhân đang lắp đặt tấm pin mặt trời trên mái nhà.","The workers are installing solar panels on the roof."]]],
        [11,2,"Travelling in the Future","Phương tiện đi lại trong tương lai","🚀","Future Simple (will) & Possessive Pronouns","Phi Công Tương Lai","🛸",
          [["driverless","/ˈdraɪvələs/","(adj)","không người lái","Driverless cars use AI to navigate safely."],["eco-friendly","/ˌiːkəʊ ˈfrendli/","(adj)","thân thiện với môi trường","Electric buses are eco-friendly and quiet."],["hyperloop","/ˈhaɪpəluːp/","(n)","tàu siêu tốc chân không","A hyperloop can travel faster than an airplane."],["bamboo-copter","/ˌbæmˈbuː ˈkɒptə/","(n)","chong chóng tre","A bamboo-copter helps you fly anywhere easily."]],
          ["<b>1. Thì Tương lai đơn (will):</b> Dự đoán về giao thông tương lai.<br>(VD: <i>People <b>will travel</b> by flying cars in 2050.</i>)","<b>2. Đại từ sở hữu (Possessive Pronouns):</b> <i>mine, yours, his, hers, ours, theirs</i>.<br>(VD: <i>This electric scooter is <b>mine</b>, not <b>hers</b>.</i>)"],
          [["In the future, ______ cars will drive themselves without a human driver.",["driverless","solar","heavy","crowded"],0,"'driverless' nghĩa là không người lái."],["Our flying car is blue, while ______ is silver.",["theirs","their","them","they"],0,"Đại từ sở hữu đứng độc lập thay cho 'their flying car' -> 'theirs'."],["Phương tiện nào thân thiện với môi trường?",["eco-friendly","polluting","noisy","dangerous"],0,"'eco-friendly' nghĩa là thân thiện với môi trường."]],
          [["Ô tô không người lái sẽ rất phổ biến trong tương lai.","Driverless cars will be very popular in the future."],["Chiếc xe điện này là của tôi, không phải của cô ấy.","This electric scooter is mine, not hers."]]],
        [12,2,"English-Speaking Countries","Các quốc gia nói tiếng Anh","🗺️","Articles (a, an, the)","Đại Sứ Khối Thịnh Vượng","🗽",
          [["native speaker","/ˌneɪtɪv ˈspiːkə/","(n)","người bản xứ","Talking with native speakers improves your accent."],["kangaroo","/ˌkæŋɡəˈruː/","(n)","chuột túi","The kangaroo is a famous symbol of Australia."],["castle","/ˈkɑːsl/","(n)","lâu đài","Scotland is famous for its ancient castles."],["island country","/ˈaɪlənd ˈkʌntri/","(n)","quốc đảo","New Zealand is a peaceful island country."]],
          ["<b>Cách dùng mạo từ (a, an, the):</b><br>• <b>a / an:</b> dùng trước danh từ đếm được số ít chưa xác định (<i>an island, a kiwi</i>).<br>• <b>the:</b> dùng trước danh từ đã xác định, so sánh nhất, tên quốc gia số nhiều/có từ chỉ thể chế (<i>the USA, the UK, the Philippines</i>) và kỳ quan/biển/sông (<i>the Thames</i>)."],
          [["London is the capital city of ______ UK.",["the","a","an","no article"],0,"Tên quốc gia có từ chỉ thể chế (United Kingdom) bắt buộc dùng 'the' -> 'the UK'."],["Australia is ______ unique country with amazing wildlife.",["a","an","the","no article"],0,"'unique' phát âm bắt đầu bằng phụ âm /j/ (/juːˈniːk/) nên dùng 'a', không dùng 'an'."],["Người nói tiếng Anh như tiếng mẹ đẻ gọi là gì?",["native speaker","foreigner","tourist","immigrant"],0,"'native speaker' là người bản xứ."]],
          [["New Zealand là một quốc đảo yên bình.","New Zealand is a peaceful island country."],["Chuột túi là một biểu tượng nổi tiếng của nước Úc.","The kangaroo is a famous symbol of Australia."]]]
      ],

      // ==================== GRADE 8 (12 UNITS) ====================
      8: [
        [1,1,"Leisure Time","Thời gian rảnh","🧶","Verbs of Liking/Disliking + V-ing / to-V","Bậc Thầy Thư Giãn","🎮",
          [["DIY","/ˌdiː aɪ ˈwaɪ/","(n)","tự tay làm đồ (Do It Yourself)","My sister loves doing DIY projects."],["origami","/ˌɒrɪˈɡɑːmi/","(n)","nghệ thuật gấp giấy Nhật Bản","Folding paper cranes is part of origami."],["knit","/nɪt/","(v)","đan len","Grandma is knitting a warm scarf for me."],["detest","/dɪˈtest/","(v)","căm ghét, cực kỳ không thích","I detest waiting in long queues."]],
          ["<b>1. Động từ chỉ theo sau bởi V-ing:</b> <i>adore, enjoy, fancy, detest, mind</i>.<br>(VD: <i>She <b>fancies making</b> origami animals.</i>)","<b>2. Động từ theo sau bởi cả V-ing và to-V:</b> <i>like, love, hate, prefer</i>.<br>(VD: <i>I <b>love surfing / to surf</b> the net.</i>)"],
          [["My brother detests ______ up early on cold winter mornings.",["getting","get","to get","got"],0,"Sau 'detest' (ghét cay đắng) chỉ dùng V-ing: 'getting'."],["Nghệ thuật gấp giấy truyền thống của Nhật Bản là gì?",["origami","pottery","puppetry","embroidery"],0,"'origami' là nghệ thuật gấp giấy."],["Do you fancy ______ to the cinema with us tonight?",["going","go","to go","went"],0,"Sau 'fancy' luôn dùng V-ing: 'going'."]],
          [["Chị gái tôi rất thích tự làm đồ thủ công vào cuối tuần.","My sister adores doing DIY projects at weekends."],["Tôi cực kỳ ghét phải chờ đợi trong hàng dài.","I detest waiting in long queues."]]],
        [2,1,"Life in the Countryside","Cuộc sống ở nông thôn","🌾","Comparative Forms of Adverbs","Điền Chủ Thảo Nguyên","🚜",
          [["harvest","/ˈhɑːvɪst/","(n/v)","vụ thu hoạch / gặt hái","Farmers are busy during the rice harvest."],["picturesque","/ˌpɪktʃəˈresk/","(adj)","đẹp như tranh vẽ","The village is surrounded by picturesque mountains."],["hospitable","/hɒˈspɪtəbl/","(adj)","hiếu khách","Local villagers are warm and hospitable."],["herd","/hɜːd/","(v)","chăn dắt (trâu, bò)","Children often help herd buffaloes after school."]],
          ["<b>So sánh hơn của Trạng từ (Comparative Adverbs):</b><br>• <b>Trạng từ ngắn (1 âm tiết):</b> <code>adv-er + than</code> (<i>faster, harder, earlier</i>).<br>• <b>Trạng từ dài (tận cùng bằng -ly):</b> <code>more + adv + than</code> (<i>more carefully, more soundly</i>).<br>• <b>Bất quy tắc:</b> <i>well → better, badly → worse</i>."],
          [["People in the countryside usually sleep ______ than those in noisy cities.",["more soundly","soundlier","most soundly","soundly"],0,"'soundly' là trạng từ dài -> so sánh hơn dùng 'more soundly'."],["During harvest time, farmers work ______ than usual.",["harder","more hard","hardest","hard"],0,"'hard' vừa là tính từ vừa là trạng từ ngắn -> so sánh hơn là 'harder'."],["Tính từ nào có nghĩa là 'hiếu khách'? ",["hospitable","picturesque","vast","crowded"],0,"'hospitable' nghĩa là mến khách, hiếu khách."]],
          [["Người dân ở nông thôn rất thân thiện và hiếu khách.","People in the countryside are very friendly and hospitable."],["Anh ấy lái xe cẩn thận hơn em trai của mình.","He drives more carefully than his younger brother."]]],
        [3,1,"Teenagers","Thanh thiếu niên","🎧","Simple, Compound & Complex Sentences","Thủ Lĩnh Học Đường","🎓",
          [["forum","/ˈfɔːrəm/","(n)","diễn đàn trực tuyến","Students share study tips on the school forum."],["pressure","/ˈpreʃə/","(n)","áp lực","Many teens face peer pressure and exam stress."],["bully","/ˈbʊli/","(v/n)","bắt nạt / kẻ bắt nạt","Schools must take action to stop cyberbullying."],["concentrate","/ˈkɒnsntreɪt/","(v)","tập trung","Turn off notifications so you can concentrate."]],
          ["<b>Phân loại câu:</b><br>• <b>Câu đơn (Simple):</b> 1 mệnh đề độc lập.<br>• <b>Câu ghép (Compound):</b> Nối 2 mệnh đề độc lập bằng liên từ <i>for, and, nor, but, or, yet, so (FANBOYS)</i> hoặc <i>therefore, however, otherwise</i>.<br>(VD: <i>She studied hard, <b>so</b> she passed the exam.</i>)"],
          [["He wanted to join the chess club; ______, he didn't have enough free time.",["however","so","and","because"],0,"Đứng sau dấu chấm phẩy và trước dấu phẩy để chỉ sự tương phản -> 'however'."],["Hurry up, ______ you will miss the school bus!",["otherwise","therefore","moreover","although"],0,"'otherwise' nghĩa là 'nếu không thì'."],["Từ nào có nghĩa là 'tập trung'?",["concentrate","upload","connect","browse"],0,"'concentrate' nghĩa là tập trung."]],
          [["Nhiều thanh thiếu niên phải đối mặt với áp lực từ bạn bè.","Many teenagers face peer pressure."],["Hãy tắt thông báo để bạn có thể tập trung học bài.","Turn off notifications so you can concentrate."]]],
        [4,1,"Ethnic Groups of Viet Nam","Các dân tộc Việt Nam","🏔️","Yes/No & Wh-questions & Countable/Uncountable","Sứ Giả 54 Dân Tộc","🏮",
          [["stilt house","/ˈstɪlt haʊs/","(n)","nhà sàn","Many ethnic minorities live in wooden stilt houses."],["terraced field","/ˌterəst ˈfiːld/","(n)","ruộng bậc thang","Sa Pa is famous for its stunning terraced fields."],["gong","/ɡɒŋ/","(n)","cồng chiêng","The Space of Gong Culture is in the Central Highlands."],["communal house","/kəˈmjuːnl haʊs/","(n)","nhà rông / nhà sinh hoạt cộng đồng","The communal house is the heart of the village."]],
          ["<b>1. Câu hỏi với từ để hỏi:</b> <i>Which ethnic group has the largest population? → The Kinh.</i>","<b>2. Danh từ đếm được & không đếm được:</b><br>• Đếm được: <i>a stilt house, many terraced fields, a few costumes</i>.<br>• Không đếm được: <i>much sticky rice, a little water</i>."],
          [["______ ethnic groups are there in Viet Nam? → 54 ethnic groups.",["How many","How much","Which","Where"],0,"'ethnic groups' là danh từ đếm được số nhiều -> dùng 'How many'."],["Ruộng bậc thang trong tiếng Anh là gì?",["terraced field","stilt house","communal house","floating market"],0,"'terraced field' là ruộng bậc thang."],["There is only ______ sticky rice left on the plate.",["a little","a few","many","several"],0,"'sticky rice' (xôi) là danh từ không đếm được -> dùng 'a little'."]],
          [["Nhiều đồng bào dân tộc thiểu số sống trong những ngôi nhà sàn.","Many ethnic minorities live in stilt houses."],["Việt Nam có năm mươi tư dân tộc anh em.","Viet Nam has fifty-four ethnic groups."]]],
        [5,1,"Our Customs and Traditions","Phong tục và truyền thống của chúng ta","🏮","Zero Article (Không dùng mạo từ)","Người Giữ Lửa Truyền Thống","🐉",
          [["worship","/ˈwɜːʃɪp/","(v/n)","thờ cúng / sự thờ phụng","Ancestor worship is an important Vietnamese tradition."],["offering","/ˈɒfərɪŋ/","(n)","đồ cúng, lễ vật","Families prepare food offerings for their ancestors."],["lantern","/ˈlæntən/","(n)","đèn lồng","Children carry colourful lanterns at Mid-Autumn Festival."],["martial arts","/ˌmɑːʃl ˈɑːts/","(n)","võ thuật","Practising martial arts improves health and discipline."]],
          ["<b>Không dùng mạo từ (Zero Article):</b><br>• Trước danh từ số nhiều hoặc không đếm được nói chung chung (<i><b>Children</b> love lanterns.</i>)<br>• Trước tên các bữa ăn (<i>have <b>breakfast / lunch / dinner</b></i>).<br>• Trước tên các môn thể thao, môn học, ngôn ngữ (<i>play <b>football</b>, speak <b>Vietnamese</b></i>)."],
          [["My family always has ______ dinner together at 7 PM.",["no article","the","a","an"],0,"Trước tên các bữa ăn (breakfast, lunch, dinner) nói chung không dùng mạo từ."],["______ ancestor worship is practised by almost all Vietnamese families.",["No article","A","An","The"],0,"Danh từ trừu tượng/không đếm được nói chung chung không dùng mạo từ."],["Lễ vật cúng tổ tiên tiếng Anh là gì?",["offering","lantern","ornament","ceremony"],0,"'offering' là đồ cúng, lễ vật."]],
          [["Thờ cúng tổ tiên là một truyền thống quan trọng của người Việt.","Ancestor worship is an important Vietnamese tradition."],["Gia đình tôi luôn ăn tối cùng nhau lúc bảy giờ.","My family always has dinner together at seven."]]],
        [6,1,"Lifestyles","Các lối sống","🌍","Future Simple & First Conditional (unless)","Nhà Khám Phá Văn Hóa","🧭",
          [["igloo","/ˈɪɡluː/","(n)","lều tuyết","Inuit people used to build igloos from blocks of snow."],["dogsled","/ˈdɒɡsled/","(n)","xe trượt tuyết chó kéo","Dogsleds are used for transport in snowy regions."],["nomadic","/nəʊˈmædɪk/","(adj)","du mục","Nomadic people move from place to place to raise livestock."],["interaction","/ˌɪntərˈækʃn/","(n)","sự tương tác","Online learning reduces face-to-face interaction."]],
          ["<b>1. Thì Tương lai đơn (will):</b> Diễn tả quyết định tại thời điểm nói hoặc dự đoán.<br>(VD: <i>I think online learning <b>will become</b> more common.</i>)","<b>2. Câu điều kiện loại 1 với 'unless' (trừ khi / nếu không):</b><br><code>Unless = If ... not</code><br>(VD: <i><b>Unless</b> you hurry, you will miss the train.</i>)"],
          [["______ we preserve traditional lifestyles, they will disappear soon.",["Unless","If","When","Because"],0,"'Unless' = Nếu không (Nếu chúng ta không bảo tồn, chúng sẽ biến mất)."],["A dome-shaped house built from blocks of snow is an ______.",["igloo","stilt house","apartment","cottage"],0,"'igloo' là lều tuyết."],["If it ______ tomorrow, we will have our picnic indoors.",["rains","will rain","rained","raining"],0,"Mệnh đề If chia hiện tại đơn: 'it rains'."]],
          [["Nếu chúng ta không bảo tồn các lối sống truyền thống, chúng sẽ biến mất.","Unless we preserve traditional lifestyles, they will disappear."],["Người du mục di chuyển từ nơi này sang nơi khác.","Nomadic people move from place to place."]]],
        [7,2,"Environmental Protection","Bảo vệ môi trường","🌿","Complex Sentences with Adverb Clauses of Time","Vệ Thần Sinh Thái","🌍",
          [["ecosystem","/ˈiːkəʊsɪstəm/","(n)","hệ sinh thái","Plastic waste threatens the marine ecosystem."],["endangered species","/ɪnˈdeɪndʒəd ˈspiːʃiːz/","(n)","các loài có nguy cơ tuyệt chủng","Saola is a rare endangered species in Viet Nam."],["carbon footprint","/ˌkɑːbən ˈfʊtprɪnt/","(n)","dấu chân các-bon (lượng khí thải)","Cycling to school helps reduce your carbon footprint."],["single-use","/ˌsɪŋɡl ˈjuːs/","(adj)","dùng một lần","Say no to single-use plastic cups and straws."]],
          ["<b>Mệnh đề trạng ngữ chỉ thời gian (Adverb Clauses of Time):</b><br>Dùng các liên từ <i>when, while, before, after, until, as soon as</i>. Lưu ý: <b>Không dùng 'will' trong mệnh đề thời gian</b>.<br>(VD: <i>We will clean up the beach <b>as soon as</b> the rain <b>stops</b>.</i>)"],
          [["We shouldn't throw rubbish into the river ______ we go camping.",["when","until","before","so"],0,"'when' (khi) nối hai mệnh đề chỉ thời gian hợp nghĩa."],["Animals and plants in danger of disappearing are called ______.",["endangered species","domestic animals","marine life","natural wonders"],0,"'endangered species' là các loài có nguy cơ tuyệt chủng."],["Turn off all the lights ______ you leave the classroom.",["before","while","until","since"],0,"Tắt đèn 'before' (trước khi) rời khỏi lớp học."]],
          [["Hãy nói không với các sản phẩm nhựa dùng một lần.","Say no to single-use plastic products."],["Đi xe đạp đến trường giúp giảm lượng khí thải các-bon.","Cycling to school helps reduce your carbon footprint."]]],
        [8,2,"Shopping","Mua sắm","🛒","Adverbs of Frequency & Present Simple for Future","Chuyên Gia Tiêu Dùng","💳",
          [["bargain","/ˈbɑːɡɪn/","(v/n)","mặc cả / món hời","You can bargain at open-air markets, not in supermarkets."],["price tag","/ˈpraɪs tæɡ/","(n)","nhãn ghi giá","Every item in the store has a clear price tag."],["browse","/braʊz/","(v)","xem lướt qua (hàng hóa/web)","I love browsing through bookshops on weekends."],["shopaholic","/ˌʃɒpəˈhɒlɪk/","(n)","người nghiện mua sắm","She is a real shopaholic who buys clothes every week."]],
          ["<b>1. Thì Hiện tại đơn mang nghĩa Tương lai:</b> Dùng cho thời gian biểu, lịch trình tàu xe, giờ mở/đóng cửa.<br>(VD: <i>The shopping mall <b>opens</b> at 9 AM tomorrow.</i>)","<b>2. Trạng từ tần suất:</b> <i>always, usually, often, sometimes, seldom, rarely, never</i>."],
          [["The autumn sale at that department store ______ next Monday.",["starts","will starting","started","start"],0,"Lịch trình cố định của cửa hàng dùng thì Hiện tại đơn: 'starts'."],["A piece of paper attached to a product showing its cost is a ______.",["price tag","receipt","discount","bargain"],0,"'price tag' là nhãn ghi giá tiền."],["You cannot ______ over prices in a supermarket.",["bargain","browse","sell","spend"],0,"'bargain' nghĩa là mặc cả giá."]],
          [["Trung tâm mua sắm mở cửa lúc chín giờ sáng mai.","The shopping mall opens at nine AM tomorrow."],["Mỗi món đồ trong siêu thị đều có nhãn ghi giá rõ ràng.","Every item in the supermarket has a clear price tag."]]],
        [9,2,"Natural Disasters","Thiên tai","🌪️","Past Continuous (Quá khứ tiếp diễn)","Đội Cứu Hộ Thiên Tai","🚒",
          [["volcanic eruption","/vɒlˈkænɪk ɪˈrʌpʃn/","(n)","núi lửa phun trào","Ash from the volcanic eruption covered the town."],["earthquake","/ˈɜːθkweɪk/","(n)","động đất","Buildings shook violently during the earthquake."],["landslide","/ˈlændslaɪd/","(n)","sạt lở đất","Heavy rain caused a serious landslide in the mountains."],["emergency kit","/ɪˈmɜːdʒənsi kɪt/","(n)","bộ dụng cụ khẩn cấp","Keep an emergency kit with a flashlight and first-aid supplies."]],
          ["<b>Thì Quá khứ tiếp diễn (Past Continuous):</b><br><code>S + was/were + V-ing</code><br>• Diễn tả hành động <b>đang xảy ra</b> tại một thời điểm trong quá khứ (<i>at 8 PM yesterday</i>).<br>• Kết hợp với Quá khứ đơn qua <i>when / while</i>: <i>While we <b>were sleeping</b>, the earthquake <b>struck</b>.</i>"],
          [["At 7 PM yesterday, residents ______ their homes before the storm hit.",["were evacuating","evacuated","are evacuating","evacuate"],0,"Có mốc thời gian cụ thể trong quá khứ (At 7 PM yesterday) -> dùng Quá khứ tiếp diễn 'were evacuating'."],["A sudden sliding of a mass of earth and rock down a mountain is a ______.",["landslide","tsunami","drought","tornado"],0,"'landslide' là sạt lở đất."],["While the rescue team ______ for survivors, another tremor happened.",["was searching","searched","is searching","searches"],0,"Hành động đang diễn ra trong quá khứ dùng 'was searching'."]],
          [["Mưa lớn đã gây ra một vụ sạt lở đất nghiêm trọng ở vùng núi.","Heavy rain caused a serious landslide in the mountains."],["Hãy chuẩn bị sẵn một bộ dụng cụ khẩn cấp trong nhà.","Keep an emergency kit ready at home."]]],
        [10,2,"Communication in the Future","Giao tiếp trong tương lai","📡","Prepositions of Place/Time & Possessive Pronouns","Nhà Du Hành Viễn Thông","📱",
          [["holography","/həˈlɒɡrəfi/","(n)","công nghệ chiếu hình 3D","Holography allows us to see 3D images of callers."],["telepathy","/təˈlepəθi/","(n)","thần giao cách cảm","In the future, people might communicate by telepathy."],["video conference","/ˈvɪdiəʊ ˈkɒnfərəns/","(n)","hội nghị truyền hình","Our team held a video conference with partners in Japan."],["language barrier","/ˈlæŋɡwɪdʒ ˈbæriə/","(n)","rào cản ngôn ngữ","Instant translation apps help remove the language barrier."]],
          ["<b>1. Giới từ chỉ thời gian (in, for, by):</b><br>• <i>in + khoảng thời gian</i>: trong vòng bao lâu nữa (<i>in 20 years</i>).<br>• <i>for + khoảng thời gian</i>: trong suốt bao lâu (<i>for two hours</i>).<br>• <i>by + mốc thời gian</i>: trước/vào thời điểm nào (<i>by 2050</i>).","<b>2. Đại từ sở hữu:</b> <i>mine, yours, his, hers, ours, theirs</i>."],
          [["______ 2050, holographic calls will replace standard video calls.",["By","For","At","On"],0,"'By + năm trong tương lai' nghĩa là 'vào/trước năm đó'."],["Communicating directly from mind to mind without speaking is called ______.",["telepathy","holography","translation","social media"],0,"'telepathy' là thần giao cách cảm."],["My smartphone is out of battery. Can I borrow ______?",["yours","your","you","mine"],0,"Đại từ sở hữu thay cho 'your smartphone' là 'yours'."]],
          [["Công nghệ chiếu hình 3D cho phép chúng ta nhìn thấy hình ảnh ba chiều.","Holography allows us to see three-dimensional images."],["Các ứng dụng dịch thuật giúp xóa bỏ rào cản ngôn ngữ.","Translation apps help remove the language barrier."]]],
        [11,2,"Science and Technology","Khoa học và Công nghệ","🔬","Reported Speech (Statements - Câu trần thuật)","Nhà Khoa Học Lỗi Lạc","🧬",
          [["biometrics","/ˌbaɪəʊˈmetrɪks/","(n)","sinh trắc học (vân tay, khuôn mặt)","Biometrics makes unlocking smartphones faster and safer."],["face recognition","/ˈfeɪs rekəɡnɪʃn/","(n)","nhận diện khuôn mặt","Our school uses face recognition for attendance."],["experiment","/ɪkˈsperɪmənt/","(n/v)","thí nghiệm","The scientist conducted a chemistry experiment."],["breakthrough","/ˈbreɪkθruː/","(n)","bước đột phá","AI is a major technological breakthrough."]],
          ["<b>Câu tường thuật dạng trần thuật (Reported Statements):</b><br><code>S + said (that) / told + O + (that) + S + V(lùi thì)</code><br>• <b>Lùi thì:</b> <i>Hiện tại đơn → Quá khứ đơn; Hiện tại tiếp diễn → Quá khứ tiếp diễn; will → would; can → could</i>.<br>• <b>Đổi trạng từ:</b> <i>now → then, today → that day, tomorrow → the next day, here → there</i>."],
          [["\"I am testing a new robot now,\" the engineer said. → The engineer said he ______ a new robot then.",["was testing","is testing","tested","tests"],0,"Lùi thì Hiện tại tiếp diễn (am testing) -> Quá khứ tiếp diễn (was testing)."],["\"We will launch the satellite tomorrow.\" → They announced they ______ launch the satellite the next day.",["would","will","can","may"],0,"Lùi thì 'will' -> 'would'."],["Công nghệ nhận diện khuôn mặt tiếng Anh là gì?",["face recognition","biometrics","eye tracking","voice command"],0,"'face recognition' là nhận diện khuôn mặt."]],
          [["Trường học của chúng tôi sử dụng nhận diện khuôn mặt để điểm danh.","Our school uses face recognition for attendance."],["Nhà khoa học nói rằng ông ấy đang thực hiện một thí nghiệm mới.","The scientist said he was conducting a new experiment."]]],
        [12,2,"Life on Other Planets","Sự sống trên các hành tinh khác","👽","Reported Speech (Wh-questions)","Chỉ Huy Hạm Đội Vũ Trụ","🛸",
          [["alien","/ˈeɪliən/","(n)","người ngoài hành tinh","Do you think aliens exist on other planets?"],["galaxy","/ˈɡæləksi/","(n)","thiên hà","Our solar system is part of the Milky Way galaxy."],["telescope","/ˈtelɪskəʊp/","(n)","kính thiên văn","Astronomers use powerful telescopes to observe stars."],["gravity","/ˈɡrævəti/","(n)","trọng lực","Without gravity, astronauts float inside the spaceship."]],
          ["<b>Câu tường thuật dạng câu hỏi Wh- (Reported Wh-questions):</b><br><code>S + asked (+ O) / wanted to know + Wh-word + S + V(lùi thì)</code><br>⚠️ Giữ nguyên từ để hỏi (<i>what, where, when, how...</i>), đưa <b>Chủ ngữ lên trước Động từ</b> và <b>lùi thì</b> (không đảo trợ động từ).<br>(VD: <i>\"Where do you live?\" → He asked me <b>where I lived</b>.</i>)"],
          [["\"How many planets are there in our solar system?\" → Nam asked the teacher ______.",["how many planets there were in our solar system","how many planets were there in our solar system","how many planets are there in our solar system","if how many planets there were"],0,"Giữ từ để hỏi 'how many planets', đưa chủ ngữ 'there' lên trước động từ lùi thì 'were'."],["The force that pulls objects toward the centre of a planet is ______.",["gravity","oxygen","atmosphere","crater"],0,"'gravity' là trọng lực."],["Kính thiên văn trong tiếng Anh là gì?",["telescope","microscope","spaceship","satellite"],0,"'telescope' là kính thiên văn."]],
          [["Các nhà thiên văn học sử dụng kính thiên văn để quan sát các ngôi sao.","Astronomers use telescopes to observe stars."],["Cô ấy hỏi tôi có bao nhiêu hành tinh trong hệ Mặt Trời.","She asked me how many planets there were in the solar system."]]]
