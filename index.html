    /* 3D Button & Card Styling (Duolingo/Game inspired) */
    .btn-3d {
      transition: all 0.1s ease;
      box-shadow: 0 4px 0 rgba(0, 0, 0, 0.2);
    }
    .btn-3d:active:not(:disabled) {
      transform: translateY(3px);
      box-shadow: 0 1px 0 rgba(0, 0, 0, 0.2);
    }
    .btn-3d:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      box-shadow: none;
      transform: translateY(2px);
    }

    .btn-green { background-color: #58cc02; box-shadow: 0 4px 0 #46a302; color: white; }
    .btn-green:hover:not(:disabled) { background-color: #61e002; }
    
    .btn-blue { background-color: #1cb0f6; box-shadow: 0 4px 0 #1899d6; color: white; }

    .btn-purple { background-color: #ce82ff; box-shadow: 0 4px 0 #a55eea; color: white; }

    .btn-amber { background-color: #ffc800; box-shadow: 0 4px 0 #e5b400; color: #4a3800; }
    .btn-amber:hover:not(:disabled) { background-color: #ffd433; }

    .btn-red { background-color: #ff4b4b; box-shadow: 0 4px 0 #ea2b2b; color: white; }
    .btn-red:hover:not(:disabled) { background-color: #ff6666; }

    .btn-white:hover:not(:disabled) { background-color: #f9fafb; }

    /* Flip Card Effect */
    .perspective-1000 { perspective: 1000px; }
    .transform-style-3d { transform-style: preserve-3d; transition: transform 0.5s cubic-bezier(0.4, 0.2, 0.2, 1); }
    .backface-hidden { backface-visibility: hidden; }
    .rotate-y-180 { transform: rotateY(180deg); }

    /* Animations */
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    .animate-float { animation: float 3s ease-in-out infinite; }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }
    .animate-shake { animation: shake 0.4s ease-in-out; }

    @keyframes popIn {
      0% { transform: scale(0.8); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    /**
     * ============================================================================
     * 1. SOUND ENGINE (Web Audio API - No external files required)
     * ============================================================================
     */
    class SoundFX {
      constructor() {
        this.enabled = true;
        this.ctx = null;
      }

      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) this.ctx = new AudioContext();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      playTone(freq, type, duration, delay = 0, vol = 0.15) {
        if (!this.enabled) return;
        try {
          this.init();
          if (!this.ctx) return;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime + delay);
          gain.gain.setValueAtTime(vol, this.ctx.currentTime + delay);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + delay + duration);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(this.ctx.currentTime + delay);
          osc.stop(this.ctx.currentTime + delay + duration);
        } catch (e) {}
      }

      click() { this.playTone(520, 'sine', 0.08, 0, 0.1); }
      correct() {
        this.playTone(587.33, 'triangle', 0.12, 0, 0.18); // D5
        this.playTone(880, 'triangle', 0.25, 0.1, 0.2);   // A5
      }
      wrong() {
        this.playTone(220, 'sawtooth', 0.18, 0, 0.15);
        this.playTone(175, 'sawtooth', 0.25, 0.12, 0.15);
      }
      levelUp() {
        [523.25, 659.25, 783.99, 1046.50].forEach((f, i) => {
          this.playTone(f, 'triangle', 0.22, i * 0.1, 0.2);
        });
      }
      victory() {
        const notes = [523.25, 659.25, 783.99, 1046.50, 783.99, 1046.50];
        const times = [0, 0.1, 0.2, 0.3, 0.45, 0.58];
        notes.forEach((f, i) => this.playTone(f, 'sine', 0.25, times[i], 0.22));
      }
      coin() {
        this.playTone(987.77, 'sine', 0.08, 0, 0.15);
        this.playTone(1318.51, 'sine', 0.2, 0.07, 0.15);
      }
    }

    const sfx = new SoundFX();

    /**
     * ============================================================================
     * 2. SPEECH SYNTHESIS (English Pronunciation)
     * ============================================================================
     */
    function speakEnglish(text) {
      sfx.click();
      if (!('speechSynthesis' in window)) {
        app.showToast('Trình duyệt của bạn không hỗ trợ đọc giọng nói.', '⚠️');
        return;
      }
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'en-US';
      utterance.rate = 0.92;
      const voices = window.speechSynthesis.getVoices();
      const enVoice = voices.find(v => v.lang.includes('en-US') && v.name.includes('Google')) || voices.find(v => v.lang.includes('en'));
      if (enVoice) utterance.voice = enVoice;
      window.speechSynthesis.speak(utterance);
    }

        desc: "Hồi phục ngay +1 Tim để tiếp tục chinh phục thử thách.",
        icon: "❤️",
        price: 30,
        type: "heart"
      },
      {
        id: "full_hearts",
        name: "Trái Tim Bất Tử",
        desc: "Hồi đầy tối đa 5/5 Tim ngay lập tức.",
        icon: "💖",
        price: 100,
        type: "full_heart"
      },
      {
        id: "hint_pack",
        name: "Cuộn Giấy Gợi Ý (x2)",
        desc: "Nhận thêm 2 lượt gợi ý 50/50 trong đấu trường Ngữ pháp & Boss.",
        icon: "💡",
        price: 40,
        type: "hint"
      },
      {
        id: "xp_boost",
        name: "Thuốc Nhân Đôi XP",
        desc: "Nhận ngay +80 XP để thăng cấp thần tốc!",
        icon: "🧪",
        price: 60,
        type: "xp"
      }
    ];

    const EXTRA_BADGES = [
      { id: "first_step", name: "Khởi Đầu Hành Trình", icon: "🌱", desc: "Hoàn thành chặng thử thách đầu tiên." },
      { id: "semester_1", name: "Chinh Phục Học Kỳ I", icon: "📘", desc: "Đánh bại toàn bộ Boss từ Unit 1 đến Unit 6." },
      { id: "semester_2", name: "Chinh Phục Học Kỳ II", icon: "📕", desc: "Đánh bại toàn bộ Boss từ Unit 7 đến Unit 12." },
      { id: "rich_scholar", name: "Triệu Phú Tri Thức", icon: "💰", desc: "Tích lũy được từ 200 Xu vàng trở lên." },
      { id: "level_5", name: "Chiến Binh Cấp 5", icon: "⚔️", desc: "Đạt đến Cấp độ 5 (Level 5)." }
    ];

    /**
     * ============================================================================
     * 5. MAIN GAME ENGINE & STATE MANAGEMENT
     * ============================================================================
     */
    function createInitialUnitProgress() {
      const prog = {};
      for (let i = 1; i <= 12; i++) {
        prog[i] = [false, false, false, false];
      }
      return prog;
    }

    const DEFAULT_STATE = {
      xp: 0,
      level: 1,
      coins: 80,
      hearts: 5,
      maxHearts: 5,
      hints: 3,
      streak: 1,
      lastLogin: new Date().toDateString(),
      sound: true,
      freeMode: false, // Allows unlocking all 12 units immediately if desired
      unitProgress: createInitialUnitProgress(),
      unlockedUnits: [1],
      badges: []
    };

    class English9Game {
      constructor() {
        this.state = this.loadState();
        this.currentTab = 'map';
        this.semesterFilter = 'all'; // 'all' | '1' | '2'
        this.activeSession = null; // Holds current stage game state
        this.timerInterval = null;
        this.init();
      }

      loadState() {
        try {
          const saved = localStorage.getItem('eng9_adventure_save_v2');
          if (saved) {
            const parsed = JSON.parse(saved);
            const mergedProgress = createInitialUnitProgress();
            if (parsed.unitProgress) {
              for (let i = 1; i <= 12; i++) {
                if (Array.isArray(parsed.unitProgress[i])) {
                  mergedProgress[i] = parsed.unitProgress[i];
                }
              }
            }
            return {
              ...DEFAULT_STATE,
              ...parsed,
              unitProgress: mergedProgress
            };
          }
        } catch (e) {}
        return JSON.parse(JSON.stringify(DEFAULT_STATE));
      }

      saveState() {
        try {
          localStorage.setItem('eng9_adventure_save_v2', JSON.stringify(this.state));
        } catch (e) {}
        this.updateHUD();
      }

      init() {
        // Check streak
        const today = new Date().toDateString();
        if (this.state.lastLogin !== today) {
          this.state.streak += 1;
          this.state.lastLogin = today;
          if (this.state.hearts < this.state.maxHearts) {
            this.state.hearts = this.state.maxHearts; // Daily heart refill
          }
        }
        sfx.enabled = this.state.sound;
        document.getElementById('btn-sound').textContent = this.state.sound ? '🔊' : '🔇';
        this.saveState();
        this.render();
      }

      toggleSound() {
        this.state.sound = !this.state.sound;
        sfx.enabled = this.state.sound;
        document.getElementById('btn-sound').textContent = this.state.sound ? '🔊' : '🔇';
        if (this.state.sound) sfx.click();
        this.saveState();
      }

      updateHUD() {
        const xpNeeded = this.state.level * 100;
        const pct = Math.min(100, Math.round((this.state.xp / xpNeeded) * 100));
        document.getElementById('hud-level').textContent = `Lv.${this.state.level}`;
        document.getElementById('hud-xp-bar').style.width = `${pct}%`;
        document.getElementById('hud-xp-text').textContent = `${this.state.xp}/${xpNeeded} XP`;
        document.getElementById('hud-streak').textContent = this.state.streak;
        document.getElementById('hud-coins').textContent = this.state.coins;
        document.getElementById('hud-hearts').textContent = this.state.hearts;
      }

      addXP(amount) {
        this.state.xp += amount;
        let leveledUp = false;
        while (this.state.xp >= this.state.level * 100) {
          this.state.xp -= this.state.level * 100;
          this.state.level += 1;
          this.state.coins += 25;
          leveledUp = true;
        }
        if (this.state.level >= 5) this.unlockBadge('level_5');
        if (leveledUp) {
          sfx.levelUp();
          this.showToast(`🎉 Thăng cấp! Bạn đã đạt Level ${this.state.level} (+25 Xu)`, '⭐');
        }
        this.saveState();
      }

      addCoins(amount) {
        this.state.coins += amount;
        if (this.state.coins >= 200) this.unlockBadge('rich_scholar');
        this.saveState();
      }
      setSemesterFilter(filter) {
        sfx.click();
        this.semesterFilter = filter;
        this.render();
      }

      toggleFreeMode() {
        sfx.click();
        this.state.freeMode = !this.state.freeMode;
        this.saveState();
        this.showToast(
          this.state.freeMode
            ? '🔓 Đã bật Chế độ tự do: Mở khóa tất cả 12 Unit!'
            : '🗺️ Đã chuyển về Chế độ phiêu lưu tuần tự!',
          '✨'
        );
        this.render();
      }

      renderMap(container) {
        const totalStages = UNITS_DATA.length * 4; // 48 stages
        let completedStages = 0;
        Object.values(this.state.unitProgress).forEach(arr => {
          completedStages += arr.filter(Boolean).length;
        });
        const overallPct = Math.round((completedStages / totalStages) * 100);

        const filteredUnits = UNITS_DATA.filter(u => {
          if (this.semesterFilter === '1') return u.semester === 1;
          if (this.semesterFilter === '2') return u.semester === 2;
          return true;
        });

        let html = `
          <!-- Adventure Banner -->
          <div class="bg-gradient-to-r from-indigo-600 via-purple-600 to-pink-500 rounded-3xl p-5 sm:p-6 text-white shadow-lg mb-5 relative overflow-hidden">
            <div class="relative z-10 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
              <div>
                <span class="inline-block bg-white/20 backdrop-blur-sm text-xs font-extrabold px-3 py-1 rounded-full mb-2">
                  🗺️ TRỌN BỘ 12 UNIT • TIẾNG ANH 9 GLOBAL SUCCESS
                </span>
                <h2 class="text-2xl sm:text-3xl font-black tracking-tight">Bản Đồ Chinh Phục Tiếng Anh 9</h2>
                <p class="text-white/90 text-sm font-semibold mt-1">Học từ vựng, ngữ pháp, ghép câu và đánh bại Boss qua đủ 12 Unit SGK!</p>
              </div>
              <div class="bg-white/15 backdrop-blur-md rounded-2xl p-3.5 min-w-[160px] border border-white/20">
                <div class="flex justify-between text-xs font-extrabold mb-1">
                  <span>Tiến độ 12 Unit</span>
                  <span>${overallPct}%</span>
                </div>
                <div class="w-full h-2.5 bg-black/25 rounded-full overflow-hidden">
                  <div class="h-full bg-amber-300 rounded-full transition-all duration-500" style="width: ${overallPct}%"></div>
                </div>
                <div class="text-[11px] font-bold text-white/80 mt-1.5">${completedStages}/${totalStages} chặng hoàn thành</div>
              </div>
            </div>
            <div class="absolute -right-6 -bottom-8 text-8xl opacity-15 pointer-events-none">🧭</div>
          </div>

          <!-- Filter & Free Mode Bar -->
          <div class="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-3 mb-6 bg-white p-3 rounded-2xl border-2 border-slate-200 shadow-sm">
            <div class="flex items-center gap-1.5 overflow-x-auto">
              <button onclick="app.setSemesterFilter('all')" class="px-3.5 py-2 rounded-xl text-xs font-black transition whitespace-nowrap ${this.semesterFilter === 'all' ? 'bg-indigo-600 text-white shadow-sm' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}">
                📚 Tất cả (12 Unit)
              </button>
              <button onclick="app.setSemesterFilter('1')" class="px-3.5 py-2 rounded-xl text-xs font-black transition whitespace-nowrap ${this.semesterFilter === '1' ? 'bg-emerald-600 text-white shadow-sm' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}">
                📘 Học kỳ I (Unit 1–6)
              </button>
              <button onclick="app.setSemesterFilter('2')" class="px-3.5 py-2 rounded-xl text-xs font-black transition whitespace-nowrap ${this.semesterFilter === '2' ? 'bg-sky-600 text-white shadow-sm' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}">
                📕 Học kỳ II (Unit 7–12)
              </button>
            </div>

            <button onclick="app.toggleFreeMode()" class="px-3.5 py-2 rounded-xl text-xs font-black border-2 transition flex items-center justify-center gap-1.5 ${this.state.freeMode ? 'bg-amber-100 border-amber-400 text-amber-900' : 'bg-slate-50 border-slate-200 text-slate-600 hover:bg-slate-100'}" title="Bật để học ngay bất kỳ Unit nào mà không cần mở khóa tuần tự">
              <span>${this.state.freeMode ? '🔓 Đang mở tự do 12 Unit' : '🔒 Mở khóa tất cả Unit'}</span>
            </button>
          </div>

          <!-- Units Adventure Path -->
          <div class="space-y-6">
        `;

        filteredUnits.forEach((unit) => {
          const isUnlocked = this.state.freeMode || this.state.unlockedUnits.includes(unit.id);
          const progress = this.state.unitProgress[unit.id] || [false, false, false, false];
          const doneCount = progress.filter(Boolean).length;
          const isUnitComplete = doneCount === 4;

          // Star rating: 0 to 3 stars based on completed stages
          const stars = doneCount === 4 ? 3 : doneCount >= 2 ? 2 : doneCount >= 1 ? 1 : 0;
          const starsHtml = [1, 2, 3].map(n => `<span class="${n <= stars ? 'text-amber-300' : 'text-white/30'}">★</span>`).join('');

          const stageMeta = [
            { idx: 0, title: "Kho Báu Từ Vựng", sub: `${unit.vocab.length} từ & Ghép cặp`, icon: "💎", unlocked: isUnlocked },
            { idx: 1, title: "Đấu Trường Ngữ Pháp", sub: "Lý thuyết & 5 câu hỏi", icon: "⚔️", unlocked: isUnlocked && (this.state.freeMode || progress[0]) },
            { idx: 2, title: "Thử Thách Ghép Câu", sub: "Sắp xếp câu chuẩn SGK", icon: "🧩", unlocked: isUnlocked && (this.state.freeMode || progress[1]) },
            { idx: 3, title: `Boss: ${unit.bossName}`, sub: "Đấu Boss tổng hợp", icon: unit.bossIcon, unlocked: isUnlocked && (this.state.freeMode || progress[2]) }
          ];

          html += `
            <div class="bg-white rounded-3xl border-2 ${isUnlocked ? 'border-slate-200 shadow-md' : 'border-slate-200/70 opacity-75'} overflow-hidden transition-all">
              <!-- Unit Header -->
              <div class="bg-gradient-to-r ${isUnlocked ? unit.gradient : 'from-slate-400 to-slate-500'} p-4 sm:p-5 text-white flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                <div class="flex items-center gap-3.5">
                  <div class="w-12 h-12 sm:w-14 sm:h-14 rounded-2xl bg-white/20 backdrop-blur-sm flex items-center justify-center text-2xl sm:text-3xl shadow-inner shrink-0">
                    ${isUnlocked ? unit.icon : '🔒'}
                  </div>
                  <div>
                    <div class="flex flex-wrap items-center gap-2">
                      <span class="text-xs font-black uppercase tracking-wider bg-black/25 px-2.5 py-0.5 rounded-lg">${unit.code} • HK${unit.semester}</span>
                      <span class="text-xs font-bold bg-white/20 px-2.5 py-0.5 rounded-lg">🎯 ${unit.grammarTag}</span>
                      ${isUnitComplete ? '<span class="text-xs font-black bg-amber-400 text-amber-950 px-2.5 py-0.5 rounded-lg">✔ HOÀN THÀNH</span>' : ''}
                    </div>
                    <h3 class="text-lg sm:text-xl font-black mt-1">${unit.title} <span class="font-bold text-white/85 text-sm sm:text-base">— ${unit.viTitle}</span></h3>
                  </div>
                </div>
                <div class="flex sm:flex-col items-center sm:items-end justify-between gap-1 shrink-0">
                  <div class="text-lg tracking-widest leading-none">${starsHtml}</div>
                  <div class="text-xs font-extrabold bg-black/20 px-3 py-1 rounded-xl">
                    ${doneCount}/4 Chặng
                  </div>
                </div>
              </div>

              <!-- 4 Stages Grid -->
              <div class="p-4 sm:p-5 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
                ${stageMeta.map(st => {
                  const isDone = progress[st.idx];
                  const canPlay = st.unlocked;
                  let cardStyle = "bg-slate-100 border-slate-200 text-slate-400 cursor-not-allowed";
                  let badgeHtml = `<span class="text-xs font-extrabold text-slate-400">🔒 Khóa</span>`;

                  if (isDone) {
                    cardStyle = "bg-emerald-50/70 border-emerald-300 text-slate-800 hover:bg-emerald-50 cursor-pointer";
                    badgeHtml = `<span class="text-xs font-black text-emerald-600 bg-emerald-100 px-2 py-0.5 rounded-lg">✔ Hoàn thành</span>`;
                  } else if (canPlay) {
                    cardStyle = "bg-white border-sky-300 text-slate-800 hover:border-sky-400 hover:shadow-md cursor-pointer ring-2 ring-sky-100";
                    badgeHtml = `<span class="text-xs font-black text-sky-600 bg-sky-100 px-2 py-0.5 rounded-lg">▶ Chơi ngay</span>`;
                  }

                  return `
                    <div onclick="${canPlay ? `app.startStage(${unit.id}, ${st.idx})` : `app.showLockedHint(${isUnlocked})`}"
                         class="rounded-2xl border-2 p-3.5 flex flex-col justify-between transition-all ${cardStyle}">
                      <div class="flex items-start justify-between gap-2 mb-2">
                        <span class="text-2xl ${canPlay ? '' : 'grayscale opacity-50'}">${st.icon}</span>
                        ${badgeHtml}
                      </div>
                      <div>
                        <div class="font-extrabold text-sm leading-snug">${st.idx + 1}. ${st.title}</div>
                        <div class="text-xs font-semibold text-slate-500 mt-0.5">${st.sub}</div>
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
            </div>
          `;
        });

        html += `</div>`;
        container.innerHTML = html;
      }

      showLockedHint(unitUnlocked) {
        sfx.wrong();
        if (!unitUnlocked) {
          this.showToast('Đánh bại Boss Unit trước hoặc bật "Mở khóa tất cả Unit" ở phía trên!', '🔒');
        } else {
          this.showToast('Hoàn thành chặng trước hoặc bật "Mở khóa tất cả Unit" để vào thẳng!', '🔒');
        }
      }

      clearTimer() {
        if (this.timerInterval) {
          clearInterval(this.timerInterval);
          this.timerInterval = null;
        }
      }

      switchTab(tab) {
        sfx.click();
        this.clearTimer();
        this.activeSession = null;
        this.currentTab = tab;
        document.getElementById('bottom-nav').classList.remove('hidden');

        // Update nav active states
        document.querySelectorAll('.nav-btn').forEach(btn => {
          btn.classList.remove('text-emerald-600', 'bg-emerald-50');
          btn.classList.add('text-slate-500');
        });
        const activeBtn = document.getElementById(`nav-${tab}`);
        if (activeBtn) {
          activeBtn.classList.remove('text-slate-500');
          activeBtn.classList.add('text-emerald-600', 'bg-emerald-50');
        }

        this.render();
      }

      goHome() {
        this.switchTab('map');
      }

      showToast(text, icon = '✨') {
        const toast = document.getElementById('toast');
        document.getElementById('toast-text').textContent = text;
        document.getElementById('toast-icon').textContent = icon;
        toast.classList.remove('opacity-0', '-translate-y-2');
        toast.classList.add('opacity-100', 'translate-y-0');
        clearTimeout(this.toastTimeout);
        this.toastTimeout = setTimeout(() => {
          toast.classList.remove('opacity-100', 'translate-y-0');
          toast.classList.add('opacity-0', '-translate-y-2');
        }, 2600);
      }

      showModal(icon, title, message, buttons) {
        const overlay = document.getElementById('modal-overlay');
        document.getElementById('modal-icon').textContent = icon;
        document.getElementById('modal-title').textContent = title;
        document.getElementById('modal-message').innerHTML = message;
        const actionsEl = document.getElementById('modal-actions');
        actionsEl.innerHTML = '';
        buttons.forEach(b => {
          const btn = document.createElement('button');
          btn.className = `btn-3d ${b.class || 'btn-blue'} px-5 py-2.5 rounded-2xl font-extrabold text-sm flex-1`;
          btn.textContent = b.label;
          btn.onclick = b.onClick;
          actionsEl.appendChild(btn);
        });
        overlay.classList.remove('hidden');
        overlay.classList.add('flex');
      }

      closeModal() {
        const overlay = document.getElementById('modal-overlay');
        overlay.classList.add('hidden');
        overlay.classList.remove('flex');
      }

      /**
       * ==========================================================================
       * 6. RENDER VIEWS (MAP, SHOP, BADGES, PROFILE)
       * ==========================================================================
       */
      render() {
        const container = document.getElementById('app-container');
        if (this.activeSession) {
          this.renderStageSession(container);
          return;
        }
        switch (this.currentTab) {
          case 'map': this.renderMap(container); break;
          case 'shop': this.renderShop(container); break;
          case 'badges': this.renderBadges(container); break;
          case 'profile': this.renderProfile(container); break;
        }
      }

      renderMap(container) {
        const totalStages = UNITS_DATA.length * 4;
        let completedStages = 0;
        Object.values(this.state.unitProgress).forEach(arr => {
          completedStages += arr.filter(Boolean).length;
        });
        const overallPct = Math.round((completedStages / totalStages) * 100);

        let html = `
          <!-- Adventure Banner -->
          <div class="bg-gradient-to-r from-indigo-600 via-purple-600 to-pink-500 rounded-3xl p-5 sm:p-6 text-white shadow-lg mb-7 relative overflow-hidden">
            <div class="relative z-10 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
              <div>
                <span class="inline-block bg-white/20 backdrop-blur-sm text-xs font-extrabold px-3 py-1 rounded-full mb-2">
                  🗺️ HÀNH TRÌNH CHINH PHỤC LỚP 9
                </span>
                <h2 class="text-2xl sm:text-3xl font-black tracking-tight">Bản Đồ Thế Giới Global Success</h2>
                <p class="text-white/90 text-sm font-semibold mt-1">Hoàn thành 4 chặng mỗi Unit để đánh bại Boss và mở khóa vùng đất mới!</p>
              </div>
              <div class="bg-white/15 backdrop-blur-md rounded-2xl p-3.5 min-w-[150px] border border-white/20">
                <div class="flex justify-between text-xs font-extrabold mb-1">
                  <span>Tiến độ tổng</span>
                  <span>${overallPct}%</span>
                </div>
                <div class="w-full h-2.5 bg-black/25 rounded-full overflow-hidden">
                  <div class="h-full bg-amber-300 rounded-full transition-all duration-500" style="width: ${overallPct}%"></div>
                </div>
                <div class="text-[11px] font-bold text-white/80 mt-1.5">${completedStages}/${totalStages} chặng hoàn thành</div>
              </div>
            </div>
            <div class="absolute -right-6 -bottom-8 text-8xl opacity-15 pointer-events-none">🧭</div>
          </div>

          <!-- Units Adventure Path -->
          <div class="space-y-6">
        `;

        UNITS_DATA.forEach((unit) => {
          const isUnlocked = this.state.unlockedUnits.includes(unit.id);
          const progress = this.state.unitProgress[unit.id] || [false, false, false, false];
          const doneCount = progress.filter(Boolean).length;
          const isUnitComplete = doneCount === 4;

          const stageMeta = [
            { idx: 0, title: "Kho Báu Từ Vựng", sub: "Flashcards & Ghép cặp", icon: "💎", unlocked: isUnlocked },
            { idx: 1, title: "Đấu Trường Ngữ Pháp", sub: "Lý thuyết & Trắc nghiệm", icon: "⚔️", unlocked: isUnlocked && progress[0] },
            { idx: 2, title: "Thử Thách Ghép Câu", sub: "Sắp xếp câu chuẩn SGK", icon: "🧩", unlocked: isUnlocked && progress[1] },
            { idx: 3, title: `Boss: ${unit.bossName}`, sub: "Đấu Boss tính giờ", icon: unit.bossIcon, unlocked: isUnlocked && progress[2] }
          ];

          html += `
            <div class="bg-white rounded-3xl border-2 ${isUnlocked ? 'border-slate-200 shadow-md' : 'border-slate-200/70 opacity-75'} overflow-hidden transition-all">
              <!-- Unit Header -->
              <div class="bg-gradient-to-r ${isUnlocked ? unit.gradient : 'from-slate-400 to-slate-500'} p-4 sm:p-5 text-white flex items-center justify-between gap-3">
                <div class="flex items-center gap-3.5">
                  <div class="w-12 h-12 sm:w-14 sm:h-14 rounded-2xl bg-white/20 backdrop-blur-sm flex items-center justify-center text-2xl sm:text-3xl shadow-inner">
                    ${isUnlocked ? unit.icon : '🔒'}
                  </div>
                  <div>
                    <div class="flex items-center gap-2">
                      <span class="text-xs font-black uppercase tracking-wider bg-black/20 px-2.5 py-0.5 rounded-lg">${unit.code}</span>
                      ${isUnitComplete ? '<span class="text-xs font-black bg-amber-400 text-amber-950 px-2.5 py-0.5 rounded-lg">★ ĐÃ CHINH PHỤC</span>' : ''}
                    </div>
                    <h3 class="text-lg sm:text-xl font-black mt-0.5">${unit.title}</h3>
                    <p class="text-xs sm:text-sm font-bold text-white/90">${unit.viTitle}</p>
                  </div>
                </div>
                <div class="text-right">
                  <div class="text-xs font-extrabold bg-white/20 px-3 py-1.5 rounded-xl">
                    ${doneCount}/4 Chặng
                  </div>
                </div>
              </div>

              <!-- 4 Stages Grid -->
              <div class="p-4 sm:p-5 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
                ${stageMeta.map(st => {
                  const isDone = progress[st.idx];
                  const canPlay = st.unlocked;
                  let cardStyle = "bg-slate-100 border-slate-200 text-slate-400 cursor-not-allowed";
                  let badgeHtml = `<span class="text-xs font-extrabold text-slate-400">🔒 Khóa</span>`;

                  if (isDone) {
                    cardStyle = "bg-emerald-50/70 border-emerald-300 text-slate-800 hover:bg-emerald-50 cursor-pointer";
                    badgeHtml = `<span class="text-xs font-black text-emerald-600 bg-emerald-100 px-2 py-0.5 rounded-lg">✔ Hoàn thành</span>`;
                  } else if (canPlay) {
                    cardStyle = "bg-white border-sky-300 text-slate-800 hover:border-sky-400 hover:shadow-md cursor-pointer ring-2 ring-sky-100";
                    badgeHtml = `<span class="text-xs font-black text-sky-600 bg-sky-100 px-2 py-0.5 rounded-lg animate-pulse">▶ Chơi ngay</span>`;
                  }

                  return `
                    <div onclick="${canPlay ? `app.startStage(${unit.id}, ${st.idx})` : `app.showLockedHint(${isUnlocked})`}"
                         class="rounded-2xl border-2 p-3.5 flex flex-col justify-between transition-all ${cardStyle}">
                      <div class="flex items-start justify-between gap-2 mb-2">
                        <span class="text-2xl ${canPlay ? '' : 'grayscale opacity-50'}">${st.icon}</span>
                        ${badgeHtml}
                      </div>
                      <div>
                        <div class="font-extrabold text-sm leading-snug">${st.idx + 1}. ${st.title}</div>
                        <div class="text-xs font-semibold text-slate-500 mt-0.5">${st.sub}</div>
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
            </div>
          `;
        });

        html += `</div>`;
        container.innerHTML = html;
      }

      showLockedHint(unitUnlocked) {
        sfx.wrong();
        if (!unitUnlocked) {
          this.showToast('Hãy đánh bại Boss ở Unit trước để mở khóa Unit này!', '🔒');
        } else {
          this.showToast('Hãy hoàn thành chặng trước đó để mở chặng này!', '🔒');
        }
      }

      renderShop(container) {
        container.innerHTML = `
          <div class="mb-6">
            <h2 class="text-2xl font-black text-slate-800 flex items-center gap-2">
              <span>🏪</span> Cửa Hàng Vật Phẩm
            </h2>
            <p class="text-sm font-semibold text-slate-500 mt-1">Sử dụng Xu vàng kiếm được từ các bài học để mua vật phẩm hỗ trợ.</p>
          </div>

          <div class="bg-amber-50 border-2 border-amber-200 rounded-2xl p-4 mb-6 flex items-center justify-between">
            <div class="flex items-center gap-3">
              <span class="text-3xl">💰</span>
              <div>
                <div class="text-xs font-bold text-amber-700 uppercase">Túi đồ hiện tại</div>
                <div class="font-black text-slate-800 text-base">
                  ${this.state.coins} Xu vàng &nbsp;•&nbsp; ${this.state.hearts}/${this.state.maxHearts} Tim &nbsp;•&nbsp; ${this.state.hints} Thẻ gợi ý 💡
                </div>
              </div>
            </div>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            ${SHOP_ITEMS.map(item => `
              <div class="bg-white rounded-3xl border-2 border-slate-200 p-5 flex flex-col justify-between shadow-sm">
                <div class="flex items-start gap-4 mb-4">
                  <div class="w-14 h-14 rounded-2xl bg-slate-100 flex items-center justify-center text-3xl shrink-0">
                    ${item.icon}
                  </div>
                  <div>
                    <h3 class="font-black text-base text-slate-800">${item.name}</h3>
                    <p class="text-xs font-semibold text-slate-500 mt-1 leading-relaxed">${item.desc}</p>
                  </div>
                </div>
                <button onclick="app.buyItem('${item.id}')" class="btn-3d btn-amber w-full py-2.5 rounded-2xl font-black text-sm flex items-center justify-center gap-1.5">
                  <span>Mua ngay:</span>
                  <span>🪙 ${item.price}</span>
                </button>
              </div>
            `).join('')}
          </div>
        `;
      }

      buyItem(itemId) {
        const item = SHOP_ITEMS.find(i => i.id === itemId);
        if (!item) return;

        if (this.state.coins < item.price) {
          sfx.wrong();
          this.showToast('Bạn không đủ Xu vàng! Hãy làm thêm bài tập để kiếm Xu nhé.', '🪙');
          return;
        }

        if ((item.type === 'heart' || item.type === 'full_heart') && this.state.hearts >= this.state.maxHearts) {
          sfx.wrong();
          this.showToast('Số tim của bạn đã đầy (5/5) rồi!', '❤️');
          return;
        }

        this.state.coins -= item.price;
        sfx.coin();

        if (item.type === 'heart') {
          this.state.hearts = Math.min(this.state.maxHearts, this.state.hearts + 1);
          this.showToast('Đã hồi phục +1 Tim!', '❤️');
        } else if (item.type === 'full_heart') {
          this.state.hearts = this.state.maxHearts;
          this.showToast('Đã hồi đầy 5/5 Tim!', '💖');
        } else if (item.type === 'hint') {
          this.state.hints += 2;
          this.showToast('Đã nhận +2 Thẻ gợi ý 50/50!', '💡');
        } else if (item.type === 'xp') {
          this.addXP(80);
          this.showToast('Đã nhận +80 XP!', '🧪');
        }

        this.saveState();
        this.render();
      }

      renderBadges(container) {
        const allBadges = [
          ...UNITS_DATA.map(u => u.badge),
          ...EXTRA_BADGES
        ];

        container.innerHTML = `
          <div class="mb-6">
            <h2 class="text-2xl font-black text-slate-800 flex items-center gap-2">
              <span>🏆</span> Phòng Trưng Bày Huy Hiệu
            </h2>
            <p class="text-sm font-semibold text-slate-500 mt-1">Đã mở khóa ${this.state.badges.length}/${allBadges.length} huy hiệu danh giá.</p>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
            ${allBadges.map(b => {
              const unlocked = this.state.badges.includes(b.id);
              return `
                <div class="rounded-3xl border-2 p-5 text-center transition-all ${unlocked ? 'bg-white border-amber-300 shadow-md' : 'bg-slate-100/80 border-slate-200 opacity-65'}">
                  <div class="w-16 h-16 mx-auto rounded-2xl ${unlocked ? 'bg-amber-100 animate-float' : 'bg-slate-200 grayscale'} flex items-center justify-center text-4xl mb-3">
                    ${b.icon}
                  </div>
                  <div class="inline-block text-[11px] font-black px-2.5 py-0.5 rounded-full mb-1.5 ${unlocked ? 'bg-emerald-100 text-emerald-700' : 'bg-slate-200 text-slate-500'}">
                    ${unlocked ? 'ĐÃ ĐẠT ĐƯỢC' : 'CHƯA MỞ KHÓA'}
                  </div>
                  <h3 class="font-black text-base text-slate-800">${b.name}</h3>
                  <p class="text-xs font-semibold text-slate-500 mt-1">${b.desc}</p>
                </div>
              `;
            }).join('')}
          </div>
        `;
      }

      renderProfile(container) {
        let totalWords = 0;
        UNITS_DATA.forEach(u => {
          if (this.state.unitProgress[u.id]?.[0]) totalWords += u.vocab.length;
        });

        container.innerHTML = `
          <div class="bg-white rounded-3xl border-2 border-slate-200 p-6 shadow-sm mb-6">
            <div class="flex flex-col sm:flex-row items-center gap-5">
              <div class="w-20 h-20 rounded-3xl bg-gradient-to-br from-emerald-400 to-teal-600 flex items-center justify-center text-4xl text-white shadow-md">
                🧑‍🎓
              </div>
              <div class="text-center sm:text-left flex-1">
                <div class="inline-block bg-indigo-100 text-indigo-700 font-black text-xs px-3 py-1 rounded-full mb-1">
                  HỌC VIÊN LỚP 9 • LEVEL ${this.state.level}
                </div>
                <h2 class="text-2xl font-black text-slate-800">Nhà Thám Hiểm Ngôn Ngữ</h2>
                <p class="text-sm font-semibold text-slate-500">Chương trình Tiếng Anh 9 - Global Success</p>
              </div>
            </div>

            <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 mt-6 pt-6 border-t-2 border-slate-100">
              <div class="bg-slate-50 p-3.5 rounded-2xl text-center">
                <div class="text-2xl font-black text-indigo-600">Lv.${this.state.level}</div>
                <div class="text-xs font-bold text-slate-500 mt-0.5">Cấp độ hiện tại</div>
              </div>
              <div class="bg-slate-50 p-3.5 rounded-2xl text-center">
                <div class="text-2xl font-black text-orange-500">🔥 ${this.state.streak}</div>
                <div class="text-xs font-bold text-slate-500 mt-0.5">Chuỗi ngày học</div>
              </div>
              <div class="bg-slate-50 p-3.5 rounded-2xl text-center">
                <div class="text-2xl font-black text-emerald-600">${totalWords}</div>
                <div class="text-xs font-bold text-slate-500 mt-0.5">Từ vựng đã thuộc</div>
              </div>
              <div class="bg-slate-50 p-3.5 rounded-2xl text-center">
                <div class="text-2xl font-black text-amber-500">${this.state.badges.length}</div>
                <div class="text-xs font-bold text-slate-500 mt-0.5">Huy hiệu đạt được</div>
              </div>
            </div>
          </div>

          <div class="bg-white rounded-3xl border-2 border-slate-200 p-6 shadow-sm">
            <h3 class="font-black text-base text-slate-800 mb-2">⚙️ Cài đặt dữ liệu học tập</h3>
            <p class="text-xs font-semibold text-slate-500 mb-4">Tiến độ của bạn được tự động lưu trên trình duyệt này. Nếu muốn bắt đầu lại từ đầu, bạn có thể đặt lại dữ liệu.</p>
            <button onclick="app.confirmReset()" class="btn-3d btn-red px-5 py-2.5 rounded-2xl font-extrabold text-sm">
              🗑️ Đặt lại toàn bộ tiến trình
            </button>
          </div>
        `;
      }

      confirmReset() {
        sfx.click();
        this.showModal(
          '⚠️',
          'Đặt lại tiến trình?',
          'Toàn bộ cấp độ, xu vàng, huy hiệu và các Unit đã mở khóa sẽ quay về ban đầu. Bạn có chắc chắn không?',
          [
            { label: 'Hủy bỏ', class: 'btn-white', onClick: () => this.closeModal() },
            {
              label: 'Đồng ý đặt lại',
              class: 'btn-red',
              onClick: () => {
                localStorage.removeItem('eng9_adventure_save_v2');
                this.state = JSON.parse(JSON.stringify(DEFAULT_STATE));
                this.saveState();
                this.closeModal();
                this.switchTab('map');
                this.showToast('Đã đặt lại tiến trình về ban đầu!', '🔄');
              }
            }
          ]
        );
      }

      /**
       * ==========================================================================
       * 7. STAGE GAMEPLAY CONTROLLERS (4 STAGES PER UNIT)
       * ==========================================================================
       */
      startStage(unitId, stageIdx) {
        if (this.state.hearts <= 0) {
          sfx.wrong();
          this.showModal(
            '💔',
            'Bạn đã hết Tim!',
            'Cần ít nhất 1 Tim để tham gia thử thách. Hãy ghé Cửa hàng để hồi phục tim bằng Xu vàng nhé!',
            [
              { label: 'Để sau', class: 'btn-white', onClick: () => this.closeModal() },
              { label: 'Mở Cửa Hàng', class: 'btn-amber', onClick: () => { this.closeModal(); this.switchTab('shop'); } }
            ]
          );
          return;
        }

        sfx.click();
        const unit = UNITS_DATA.find(u => u.id === unitId);
        document.getElementById('bottom-nav').classList.add('hidden');

        if (stageIdx === 0) {
          // Stage 1: Vocabulary Flashcards + Matching Mini-game (6 random pairs from 8 words)
          const pairs = [...unit.vocab].sort(() => Math.random() - 0.5).slice(0, 6);
          const leftItems = pairs.map((v, i) => ({ id: i, text: v.word })).sort(() => Math.random() - 0.5);
          const rightItems = pairs.map((v, i) => ({ id: i, text: v.meaning })).sort(() => Math.random() - 0.5);

          this.activeSession = {
            unit,
            stageIdx: 0,
            phase: 'flashcards', // 'flashcards' -> 'matching'
            cardIdx: 0,
            flipped: false,
            leftItems,
            rightItems,
            selectedLeft: null,
            selectedRight: null,
            matchedIds: []
          };
        } else if (stageIdx === 1) {
          // Stage 2: Grammar Quest (Theory + Quiz)
          this.activeSession = {
            unit,
            stageIdx: 1,
            phase: 'theory', // 'theory' -> 'quiz'
            qIdx: 0,
            combo: 0,
            selectedOption: null,
            isAnswered: false,
            hiddenOptions: []
          };
        } else if (stageIdx === 2) {
          // Stage 3: Sentence Builder
          const sentences = unit.sentences.map(s => ({
            ...s,
            shuffled: [...s.words].sort(() => Math.random() - 0.5)
          }));
          this.activeSession = {
            unit,
            stageIdx: 2,
            sIdx: 0,
            sentences,
            chosenIndices: [],
            isChecked: false,
            isCorrect: false
          };
        } else if (stageIdx === 3) {
          // Stage 4: Boss Challenge (Timed Quiz with Combo)
          this.activeSession = {
            unit,
            stageIdx: 3,
            qIdx: 0,
            combo: 0,
            timeLeft: 75,
            bossHp: 100,
            selectedOption: null,
            isAnswered: false,
            hiddenOptions: []
          };
          this.startBossTimer();
        }

        this.render();
      }

      startBossTimer() {
        this.clearTimer();
        this.timerInterval = setInterval(() => {
          if (!this.activeSession || this.activeSession.stageIdx !== 3) {
            this.clearTimer();
            return;
          }
          this.activeSession.timeLeft -= 1;
          const timerEl = document.getElementById('boss-timer');
          if (timerEl) {
            timerEl.textContent = `${this.activeSession.timeLeft}s`;
            if (this.activeSession.timeLeft <= 10) timerEl.classList.add('text-rose-600', 'animate-pulse');
          }
          if (this.activeSession.timeLeft <= 0) {
            this.clearTimer();
            sfx.wrong();
            this.showModal(
              '⏰',
              'Hết Giờ Đấu Boss!',
              `${this.activeSession.unit.bossName} đã trốn thoát vì hết thời gian. Hãy thử lại và trả lời nhanh hơn nhé!`,
              [{ label: 'Quay về Bản Đồ', class: 'btn-blue', onClick: () => { this.closeModal(); this.goHome(); } }]
            );
          }
        }, 1000);
      }

      renderStageSession(container) {
        const s = this.activeSession;
        const unit = s.unit;

        // Top Stage Header with Exit button
        let html = `
          <div class="flex items-center justify-between gap-3 mb-5">
            <button onclick="app.exitStage()" class="btn-3d btn-white px-3.5 py-2 rounded-2xl font-extrabold text-xs sm:text-sm flex items-center gap-1">
              ✕ Thoát
            </button>
            <div class="text-center">
              <span class="text-xs font-black uppercase text-slate-400">${unit.code}: ${unit.title}</span>
              <h2 class="font-black text-base sm:text-lg text-slate-800">
                ${['💎 Kho Báu Từ Vựng', '⚔️ Đấu Trường Ngữ Pháp', '🧩 Thử Thách Ghép Câu', `${unit.bossIcon} Đấu Boss: ${unit.bossName}`][s.stageIdx]}
              </h2>
            </div>
            <div class="w-16 text-right font-black text-sm text-rose-500">
              ❤️ ${this.state.hearts}
            </div>
          </div>
        `;

        if (s.stageIdx === 0) html += this.renderStage1Vocab(s);
        else if (s.stageIdx === 1) html += this.renderStage2Grammar(s);
        else if (s.stageIdx === 2) html += this.renderStage3Sentence(s);
        else if (s.stageIdx === 3) html += this.renderStage4Boss(s);

        container.innerHTML = html;
      }

      exitStage() {
        sfx.click();
        this.clearTimer();
        this.goHome();
      }

      /**
       * --- STAGE 1: VOCABULARY FLASHCARDS & MATCHING ---
       */
      renderStage1Vocab(s) {
        if (s.phase === 'flashcards') {
          const vocabList = s.unit.vocab;
          const item = vocabList[s.cardIdx];
          const progressPct = Math.round(((s.cardIdx + 1) / vocabList.length) * 100);

          return `
            <div class="max-w-lg mx-auto">
              <!-- Progress -->
              <div class="flex items-center gap-3 mb-4">
                <div class="flex-1 h-3 bg-slate-200 rounded-full overflow-hidden">
                  <div class="h-full bg-emerald-500 transition-all duration-300" style="width: ${progressPct}%"></div>
                </div>
                <span class="text-xs font-black text-slate-500">Thẻ ${s.cardIdx + 1}/${vocabList.length}</span>
              </div>

              <!-- Flashcard -->
              <div onclick="app.flipCard()" class="perspective-1000 cursor-pointer h-80 sm:h-88 mb-5">
                <div class="relative w-full h-full transform-style-3d ${s.flipped ? 'rotate-y-180' : ''}">
                  <!-- Front -->
                  <div class="absolute inset-0 backface-hidden bg-white rounded-3xl border-2 border-slate-200 shadow-lg p-6 flex flex-col items-center justify-center text-center">
                    <span class="text-xs font-extrabold text-emerald-600 bg-emerald-50 px-3 py-1 rounded-full mb-4">NHẤN ĐỂ LẬT THẺ 🔄</span>
                    <h3 class="text-3xl sm:text-4xl font-black text-slate-800 mb-2">${item.word}</h3>
                    <div class="text-base font-bold text-slate-400 mb-5">${item.ipa} <span class="text-indigo-500">${item.type}</span></div>
                    <button onclick="event.stopPropagation(); speakEnglish('${item.word.replace(/'/g, "\\'")}')" class="btn-3d btn-blue px-5 py-2.5 rounded-2xl font-extrabold text-sm flex items-center gap-2">
                      🔊 Nghe phát âm
                    </button>
                  </div>

                  <!-- Back -->
                  <div class="absolute inset-0 backface-hidden rotate-y-180 bg-gradient-to-br from-emerald-50 to-teal-50 rounded-3xl border-2 border-emerald-300 shadow-lg p-6 flex flex-col items-center justify-center text-center">
                    <div class="text-xs font-black text-emerald-700 uppercase mb-1">Nghĩa tiếng Việt</div>
                    <h3 class="text-2xl sm:text-3xl font-black text-emerald-800 mb-4">${item.meaning}</h3>
                    <div class="bg-white/90 rounded-2xl p-4 border border-emerald-200 w-full">
                      <div class="text-xs font-extrabold text-slate-400 mb-1">Ví dụ trong ngữ cảnh:</div>
                      <p class="text-sm font-bold text-slate-700 italic">"${item.example}"</p>
                      <button onclick="event.stopPropagation(); speakEnglish('${item.example.replace(/'/g, "\\'")}')" class="mt-2.5 text-xs font-black text-sky-600 hover:underline">
                        🔊 Đọc câu ví dụ
                      </button>
                    </div>
                  </div>
                </div>
              </div>

              <!-- Controls -->
              <div class="flex gap-3">
                <button onclick="app.prevCard()" ${s.cardIdx === 0 ? 'disabled' : ''} class="btn-3d btn-white px-5 py-3 rounded-2xl font-extrabold text-sm">
                  ← Trước
                </button>
                <button onclick="app.nextCard()" class="btn-3d btn-green flex-1 py-3 rounded-2xl font-black text-sm">
                  ${s.cardIdx < vocabList.length - 1 ? 'Từ tiếp theo →' : 'Vào Mini-Game Ghép Cặp 🎮'}
                </button>
              </div>
            </div>
          `;
        } else {
          // Matching Phase
          return `
            <div class="max-w-2xl mx-auto">
              <div class="bg-sky-50 border-2 border-sky-200 rounded-2xl p-3.5 text-center mb-5">
                <p class="font-extrabold text-sm text-sky-800">🎯 Ghép từ tiếng Anh ở cột trái với nghĩa tiếng Việt tương ứng ở cột phải!</p>
              </div>

              <div class="grid grid-cols-2 gap-3 sm:gap-5">
                <!-- Left Column (English) -->
                <div class="space-y-3">
                  ${s.leftItems.map(item => {
                    const isMatched = s.matchedIds.includes(item.id);
                    const isSelected = s.selectedLeft === item.id;
                    let cls = "btn-white";
                    if (isMatched) cls = "bg-emerald-100 border-2 border-emerald-400 text-emerald-700 opacity-50 pointer-events-none";
                    else if (isSelected) cls = "bg-sky-100 border-2 border-sky-500 text-sky-900 ring-2 ring-sky-200";

                    return `
                      <button onclick="app.selectMatch('left', ${item.id})" class="btn-3d ${cls} w-full p-3.5 rounded-2xl font-black text-sm sm:text-base text-center">
                        ${item.text}
                      </button>
                    `;
                  }).join('')}
                </div>

                <!-- Right Column (Vietnamese) -->
                <div class="space-y-3">
                  ${s.rightItems.map(item => {
                    const isMatched = s.matchedIds.includes(item.id);
                    const isSelected = s.selectedRight === item.id;
                    let cls = "btn-white";
                    if (isMatched) cls = "bg-emerald-100 border-2 border-emerald-400 text-emerald-700 opacity-50 pointer-events-none";
                    else if (isSelected) cls = "bg-sky-100 border-2 border-sky-500 text-sky-900 ring-2 ring-sky-200";

                    return `
                      <button onclick="app.selectMatch('right', ${item.id})" class="btn-3d ${cls} w-full p-3.5 rounded-2xl font-bold text-xs sm:text-sm text-center">
                        ${item.text}
                      </button>
                    `;
                  }).join('')}
                </div>
              </div>
            </div>
          `;
        }
      }

      flipCard() {
        sfx.click();
        this.activeSession.flipped = !this.activeSession.flipped;
        this.render();
      }

      prevCard() {
        if (this.activeSession.cardIdx > 0) {
          sfx.click();
          this.activeSession.cardIdx -= 1;
          this.activeSession.flipped = false;
          this.render();
        }
      }

      nextCard() {
        sfx.click();
        const s = this.activeSession;
        if (s.cardIdx < s.unit.vocab.length - 1) {
          s.cardIdx += 1;
          s.flipped = false;
        } else {
          s.phase = 'matching';
        }
        this.render();
      }

      selectMatch(side, id) {
        const s = this.activeSession;
        if (s.matchedIds.includes(id)) return;

        if (side === 'left') {
          s.selectedLeft = id;
          const wordObj = s.leftItems.find(i => i.id === id);
          if (wordObj) speakEnglish(wordObj.text);
        } else {
          sfx.click();
          s.selectedRight = id;
        }

        if (s.selectedLeft !== null && s.selectedRight !== null) {
          if (s.selectedLeft === s.selectedRight) {
            sfx.correct();
            s.matchedIds.push(s.selectedLeft);
            s.selectedLeft = null;
            s.selectedRight = null;
            if (s.matchedIds.length === s.leftItems.length) {
              setTimeout(() => this.completeStage(30, 15), 400);
            }
          } else {
            sfx.wrong();
            s.selectedLeft = null;
            s.selectedRight = null;
            this.showToast('Chưa khớp rồi, thử lại nhé!', '❌');
            if (this.loseHeart()) return;
          }
        }
        this.render();
      }

      /**
       * --- STAGE 2: GRAMMAR QUEST ---
       */
      renderStage2Grammar(s) {
        if (s.phase === 'theory') {
          const note = s.unit.grammarNote;
          return `
            <div class="max-w-2xl mx-auto bg-white rounded-3xl border-2 border-slate-200 p-6 shadow-md">
              <div class="inline-block bg-indigo-100 text-indigo-700 font-black text-xs px-3 py-1 rounded-full mb-2">
                📖 BÍ KÍP NGỮ PHÁP TRỌNG TÂM
              </div>
              <h3 class="text-xl sm:text-2xl font-black text-slate-800 mb-4">${note.title}</h3>
              <div class="space-y-3 mb-6">
                ${note.points.map(p => `
                  <div class="bg-slate-50 border-l-4 border-indigo-500 p-4 rounded-r-2xl text-sm text-slate-700 leading-relaxed font-medium">
                    ${p}
                  </div>
                `).join('')}
              </div>
              <button onclick="app.startGrammarQuiz()" class="btn-3d btn-green w-full py-3.5 rounded-2xl font-black text-base">
                Đã hiểu bí kíp! Bắt đầu thực chiến ⚔️
              </button>
            </div>
          `;
        }

        const questions = s.unit.grammarQuiz;
        const q = questions[s.qIdx];
        const pct = Math.round(((s.qIdx) / questions.length) * 100);

        return `
          <div class="max-w-2xl mx-auto">
            <div class="flex items-center justify-between gap-3 mb-4">
              <div class="flex-1 h-3 bg-slate-200 rounded-full overflow-hidden">
                <div class="h-full bg-indigo-500 transition-all duration-300" style="width: ${pct}%"></div>
              </div>
              <span class="text-xs font-black text-slate-500">Câu ${s.qIdx + 1}/${questions.length}</span>
              <button onclick="app.useHint()" ${s.isAnswered || s.hiddenOptions.length > 0 ? 'disabled' : ''} class="btn-3d btn-amber px-3 py-1.5 rounded-xl font-black text-xs flex items-center gap-1" title="Dùng thẻ gợi ý 50/50">
                💡 50/50 (${this.state.hints})
              </button>
            </div>

            <div class="bg-white rounded-3xl border-2 border-slate-200 p-5 sm:p-6 shadow-md mb-4">
              <p class="text-lg sm:text-xl font-extrabold text-slate-800 leading-relaxed mb-5">${q.q}</p>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                ${q.options.map((opt, idx) => {
                  if (s.hiddenOptions.includes(idx)) {
                    return `<div class="p-3.5 rounded-2xl border-2 border-dashed border-slate-200 text-slate-300 text-center font-bold text-sm">Đã loại bỏ</div>`;
                  }
                  let btnClass = "btn-white";
                  if (s.isAnswered) {
                    if (idx === q.answer) btnClass = "btn-green";
                    else if (idx === s.selectedOption) btnClass = "btn-red";
                    else btnClass = "btn-white opacity-50";
                  }
                  return `
                    <button onclick="app.answerQuiz(${idx})" ${s.isAnswered ? 'disabled' : ''} class="btn-3d ${btnClass} p-3.5 rounded-2xl font-extrabold text-sm sm:text-base text-left flex items-center gap-2.5">
                      <span class="w-7 h-7 rounded-lg bg-black/10 flex items-center justify-center text-xs font-black shrink-0">${['A','B','C','D'][idx]}</span>
                      <span>${opt}</span>
                    </button>
                  `;
                }).join('')}
              </div>
            </div>

            ${s.isAnswered ? `
              <div class="rounded-3xl p-4 sm:p-5 border-2 mb-4 animate-pop ${s.selectedOption === q.answer ? 'bg-emerald-50 border-emerald-300' : 'bg-rose-50 border-rose-300'}">
                <div class="font-black text-base mb-1 ${s.selectedOption === q.answer ? 'text-emerald-700' : 'text-rose-700'}">
                  ${s.selectedOption === q.answer ? '🎉 Chính xác!' : '😅 Chưa chính xác rồi!'}
                </div>
                <p class="text-sm font-semibold text-slate-700 leading-relaxed mb-4">💡 <b>Giải thích:</b> ${q.explain}</p>
                <button onclick="app.nextQuizQuestion()" class="btn-3d ${s.selectedOption === q.answer ? 'btn-green' : 'btn-blue'} w-full py-3 rounded-2xl font-black text-sm">
                  ${s.qIdx < questions.length - 1 ? 'Câu tiếp theo →' : 'Hoàn thành Đấu Trường 🏆'}
                </button>
              </div>
            ` : ''}
          </div>
        `;
      }

      startGrammarQuiz() {
        sfx.click();
        this.activeSession.phase = 'quiz';
        this.render();
      }

      useHint() {
        const s = this.activeSession;
        if (s.isAnswered || s.hiddenOptions.length > 0) return;
        if (this.state.hints <= 0) {
          sfx.wrong();
          this.showToast('Bạn đã hết Thẻ gợi ý! Có thể mua thêm trong Cửa hàng.', '💡');
          return;
        }
        const questions = s.stageIdx === 1 ? s.unit.grammarQuiz : s.unit.bossQuestions;
        const q = questions[s.qIdx];
        const wrongIndices = [0, 1, 2, 3].filter(i => i !== q.answer).sort(() => Math.random() - 0.5);
        s.hiddenOptions = wrongIndices.slice(0, 2);
        this.state.hints -= 1;
        sfx.coin();
        this.saveState();
        this.render();
      }

      answerQuiz(idx) {
        const s = this.activeSession;
        if (s.isAnswered) return;
        const questions = s.stageIdx === 1 ? s.unit.grammarQuiz : s.unit.bossQuestions;
        const q = questions[s.qIdx];

        s.selectedOption = idx;
        s.isAnswered = true;

        if (idx === q.answer) {
          sfx.correct();
          s.combo = (s.combo || 0) + 1;
          if (s.combo >= 2) {
            this.showToast(`🔥 Combo x${s.combo}! Trả lời liên tiếp cực đỉnh!`, '⚡');
          }
          if (s.stageIdx === 3) {
            s.bossHp = Math.max(0, s.bossHp - Math.ceil(100 / questions.length));
          }
        } else {
          sfx.wrong();
          s.combo = 0;
          if (this.loseHeart()) return;
        }
        this.render();
      }

      nextQuizQuestion() {
        sfx.click();
        const s = this.activeSession;
        const questions = s.stageIdx === 1 ? s.unit.grammarQuiz : s.unit.bossQuestions;

        if (s.qIdx < questions.length - 1) {
          s.qIdx += 1;
          s.selectedOption = null;
          s.isAnswered = false;
          s.hiddenOptions = [];
          this.render();
        } else {
          const comboBonus = (s.combo || 0) * 5;
          if (s.stageIdx === 1) {
            this.completeStage(45 + comboBonus, 20);
          } else {
            this.clearTimer();
            this.completeStage(90 + comboBonus, 45, true);
          }
        }
      }

      /**
       * --- STAGE 3: SENTENCE BUILDER ---
       */
      renderStage3Sentence(s) {
        const item = s.sentences[s.sIdx];
        const pct = Math.round((s.sIdx / s.sentences.length) * 100);

        return `
          <div class="max-w-2xl mx-auto">
            <div class="flex items-center gap-3 mb-4">
              <div class="flex-1 h-3 bg-slate-200 rounded-full overflow-hidden">
                <div class="h-full bg-purple-500 transition-all duration-300" style="width: ${pct}%"></div>
              </div>
              <span class="text-xs font-black text-slate-500">Câu ${s.sIdx + 1}/${s.sentences.length}</span>
            </div>

            <div class="bg-white rounded-3xl border-2 border-slate-200 p-5 sm:p-6 shadow-md mb-5">
              <div class="text-xs font-black text-purple-600 uppercase mb-1">🇻🇳 Dịch & Sắp xếp thành câu tiếng Anh hoàn chỉnh:</div>
              <p class="text-base sm:text-lg font-extrabold text-slate-800 mb-5">"${item.hint}"</p>

              <!-- Answer Drop Zone -->
              <div class="min-h-[84px] bg-slate-50 border-2 border-dashed border-slate-300 rounded-2xl p-3 flex flex-wrap gap-2 items-center mb-5">
                ${s.chosenIndices.length === 0 ? `<span class="text-xs font-bold text-slate-400 mx-auto">Nhấn vào các từ bên dưới để ghép câu...</span>` : ''}
                ${s.chosenIndices.map((wordIdx, pos) => `
                  <button onclick="app.removeWord(${pos})" ${s.isChecked && s.isCorrect ? 'disabled' : ''} class="btn-3d btn-blue px-3.5 py-2 rounded-xl font-extrabold text-sm">
                    ${item.shuffled[wordIdx]}
                  </button>
                `).join('')}
              </div>

              <!-- Word Bank -->
              <div class="flex flex-wrap gap-2.5 justify-center">
                ${item.shuffled.map((w, idx) => {
                  const used = s.chosenIndices.includes(idx);
                  return `
                    <button onclick="app.pickWord(${idx})" ${used || (s.isChecked && s.isCorrect) ? 'disabled' : ''} class="btn-3d ${used ? 'bg-slate-200 text-transparent border-slate-200 shadow-none' : 'btn-white'} px-3.5 py-2 rounded-xl font-extrabold text-sm">
                      ${w}
                    </button>
                  `;
                }).join('')}
              </div>
            </div>

            ${!s.isChecked || !s.isCorrect ? `
              <button onclick="app.checkSentence()" ${s.chosenIndices.length !== item.words.length ? 'disabled' : ''} class="btn-3d btn-green w-full py-3.5 rounded-2xl font-black text-base">
                Kiểm tra câu trả lời ✔
              </button>
            ` : `
              <div class="bg-emerald-50 border-2 border-emerald-300 rounded-3xl p-4 animate-pop">
                <div class="flex items-center justify-between mb-3">
                  <span class="font-black text-emerald-700 text-base">🎉 Tuyệt vời! Câu hoàn toàn chính xác.</span>
                  <button onclick="speakEnglish('${item.words.join(' ').replace(/'/g, "\\'")}')" class="text-xs font-black text-sky-600 bg-white px-3 py-1.5 rounded-xl border border-sky-200">
                    🔊 Nghe câu
                  </button>
                </div>
                <button onclick="app.nextSentence()" class="btn-3d btn-green w-full py-3 rounded-2xl font-black text-sm">
                  ${s.sIdx < s.sentences.length - 1 ? 'Câu tiếp theo →' : 'Hoàn thành Ghép Câu 🏆'}
                </button>
              </div>
            `}
          </div>
        `;
      }

      pickWord(wordIdx) {
        sfx.click();
        const s = this.activeSession;
        if (!s.chosenIndices.includes(wordIdx)) {
          s.chosenIndices.push(wordIdx);
          s.isChecked = false;
          this.render();
        }
      }

      removeWord(pos) {
        sfx.click();
        const s = this.activeSession;
        s.chosenIndices.splice(pos, 1);
        s.isChecked = false;
        this.render();
      }

      checkSentence() {
        const s = this.activeSession;
        const item = s.sentences[s.sIdx];
        const userSentence = s.chosenIndices.map(i => item.shuffled[i]).join(' ');
        const targetSentence = item.words.join(' ');

        s.isChecked = true;
        if (userSentence === targetSentence) {
          sfx.correct();
          s.isCorrect = true;
          speakEnglish(targetSentence);
        } else {
          sfx.wrong();
          s.isCorrect = false;
          this.showToast('Thứ tự từ chưa đúng rồi, hãy sắp xếp lại nhé!', '❌');
          if (this.loseHeart()) return;
        }
        this.render();
      }

      nextSentence() {
        sfx.click();
        const s = this.activeSession;
        if (s.sIdx < s.sentences.length - 1) {
          s.sIdx += 1;
          s.chosenIndices = [];
          s.isChecked = false;
          s.isCorrect = false;
          this.render();
        } else {
          this.completeStage(50, 25);
        }
      }

      /**
       * --- STAGE 4: UNIT BOSS CHALLENGE ---
       */
      renderStage4Boss(s) {
        const questions = s.unit.bossQuestions;
        const q = questions[s.qIdx];

        return `
          <div class="max-w-2xl mx-auto">
            <!-- Boss Arena Bar -->
            <div class="bg-slate-900 text-white rounded-3xl p-4 sm:p-5 mb-5 shadow-lg border-2 border-slate-700">
              <div class="flex items-center justify-between gap-4">
                <div class="flex items-center gap-3">
                  <div class="w-14 h-14 rounded-2xl bg-rose-500/20 border-2 border-rose-500 flex items-center justify-center text-3xl animate-float">
                    ${s.unit.bossIcon}
                  </div>
                  <div>
                    <div class="text-xs font-black text-rose-400 uppercase">BOSS CUỐI UNIT</div>
                    <div class="font-black text-base sm:text-lg">${s.unit.bossName}</div>
                    <!-- Boss HP Bar -->
                    <div class="w-36 sm:w-48 h-3 bg-slate-700 rounded-full overflow-hidden mt-1.5 border border-slate-600">
                      <div class="h-full bg-gradient-to-r from-rose-500 to-amber-500 transition-all duration-500" style="width: ${s.bossHp}%"></div>
                    </div>
                  </div>
                </div>

                <!-- Timer -->
                <div class="text-center bg-slate-800 px-4 py-2 rounded-2xl border border-slate-700">
                  <div class="text-[10px] font-extrabold text-slate-400 uppercase">Thời gian</div>
                  <div id="boss-timer" class="text-xl sm:text-2xl font-black text-amber-400">${s.timeLeft}s</div>
                </div>
              </div>
            </div>

            <!-- Question Card -->
            <div class="flex items-center justify-between mb-3">
              <span class="text-xs font-black text-slate-500">Đòn tấn công ${s.qIdx + 1}/${questions.length}</span>
              <button onclick="app.useHint()" ${s.isAnswered || s.hiddenOptions.length > 0 ? 'disabled' : ''} class="btn-3d btn-amber px-3 py-1 rounded-xl font-black text-xs">
                💡 50/50 (${this.state.hints})
              </button>
            </div>

            <div class="bg-white rounded-3xl border-2 border-slate-200 p-5 sm:p-6 shadow-md mb-4">
              <p class="text-lg sm:text-xl font-extrabold text-slate-800 leading-relaxed mb-5">${q.q}</p>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                ${q.options.map((opt, idx) => {
                  if (s.hiddenOptions.includes(idx)) {
                    return `<div class="p-3.5 rounded-2xl border-2 border-dashed border-slate-200 text-slate-300 text-center font-bold text-sm">Đã loại bỏ</div>`;
                  }
                  let btnClass = "btn-white";
                  if (s.isAnswered) {
                    if (idx === q.answer) btnClass = "btn-green";
                    else if (idx === s.selectedOption) btnClass = "btn-red";
                    else btnClass = "btn-white opacity-50";
                  }
                  return `
                    <button onclick="app.answerQuiz(${idx})" ${s.isAnswered ? 'disabled' : ''} class="btn-3d ${btnClass} p-3.5 rounded-2xl font-extrabold text-sm sm:text-base text-left flex items-center gap-2.5">
                      <span class="w-7 h-7 rounded-lg bg-black/10 flex items-center justify-center text-xs font-black shrink-0">${['A','B','C','D'][idx]}</span>
                      <span>${opt}</span>
                    </button>
                  `;
                }).join('')}
              </div>
            </div>

            ${s.isAnswered ? `
              <div class="rounded-3xl p-4 border-2 animate-pop ${s.selectedOption === q.answer ? 'bg-emerald-50 border-emerald-300' : 'bg-rose-50 border-rose-300'}">
                <div class="font-black text-sm mb-1 ${s.selectedOption === q.answer ? 'text-emerald-700' : 'text-rose-700'}">
                  ${s.selectedOption === q.answer ? '⚔️ Đòn đánh chí mạng! Boss mất máu!' : '🛡️ Boss đỡ được đòn!'}
                </div>
                <p class="text-xs sm:text-sm font-semibold text-slate-700 mb-3">${q.explain}</p>
                <button onclick="app.nextQuizQuestion()" class="btn-3d btn-purple w-full py-3 rounded-2xl font-black text-sm">
                  ${s.qIdx < questions.length - 1 ? 'Tiếp tục tấn công →' : 'Kết liễu Boss! 💥'}
                </button>
              </div>
            ` : ''}
          </div>
        `;
      }

      /**
       * ==========================================================================
       * 8. STAGE COMPLETION & CELEBRATION
       * ==========================================================================
       */
      completeStage(xpReward, coinReward, isBoss = false) {
        const s = this.activeSession;
        const unitId = s.unit.id;
        const stageIdx = s.stageIdx;

        // Mark stage complete
        this.state.unitProgress[unitId][stageIdx] = true;
        this.unlockBadge('first_step');

        // Check Semester 1 (Units 1-6) & Semester 2 (Units 7-12) completion badges
        const sem1Done = [1, 2, 3, 4, 5, 6].every(id => this.state.unitProgress[id]?.[3]);
        const sem2Done = [7, 8, 9, 10, 11, 12].every(id => this.state.unitProgress[id]?.[3]);
        if (sem1Done) this.unlockBadge('semester_1');
        if (sem2Done) this.unlockBadge('semester_2');

        let extraMsg = '';
        if (isBoss) {
          this.unlockBadge(s.unit.badge.id);
          const nextUnitId = unitId + 1;
          if (nextUnitId <= UNITS_DATA.length && !this.state.unlockedUnits.includes(nextUnitId)) {
            this.state.unlockedUnits.push(nextUnitId);
            extraMsg = `<br><span class="text-emerald-600 font-black">🔓 Đã mở khóa Unit ${nextUnitId}!</span>`;
          }
          extraMsg += `<br><span class="text-amber-600 font-black">🏅 Nhận huy hiệu: ${s.unit.badge.name}</span>`;
          sfx.victory();
          triggerConfetti();
        } else {
          sfx.levelUp();
        }

        this.addXP(xpReward);
        this.addCoins(coinReward);
        this.saveState();

        this.showModal(
          isBoss ? '👑' : '🎉',
          isBoss ? `Đánh Bại ${s.unit.bossName}!` : 'Hoàn Thành Chặng Thử Thách!',
          `Bạn nhận được <b>+${xpReward} XP</b> và <b>+${coinReward} Xu vàng</b>!${extraMsg}`,
          [
            {
              label: 'Tiếp tục hành trình 🗺️',
              class: 'btn-green',
              onClick: () => {
                this.closeModal();
                this.goHome();
              }
            }
          ]
        );
      }
    }

    /**
     * ============================================================================
     * 9. CONFETTI CELEBRATION EFFECT
     * ============================================================================
     */
    function triggerConfetti() {
      const canvas = document.getElementById('confetti-canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const colors = ['#58cc02', '#1cb0f6', '#ffc800', '#ff4b4b', '#ce82ff'];
      const pieces = Array.from({ length: 90 }, () => ({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height - canvas.height,
        w: Math.random() * 10 + 6,
        h: Math.random() * 6 + 4,
        color: colors[Math.floor(Math.random() * colors.length)],
        vy: Math.random() * 3 + 2,
        vx: (Math.random() - 0.5) * 2,
        rot: Math.random() * 360,
        vRot: (Math.random() - 0.5) * 10
      }));

      let frames = 0;
      function loop() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        pieces.forEach(p => {
          p.y += p.vy;
          p.x += p.vx;
          p.rot += p.vRot;
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate((p.rot * Math.PI) / 180);
          ctx.fillStyle = p.color;
          ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
          ctx.restore();
        });
        frames++;
        if (frames < 160) requestAnimationFrame(loop);
        else ctx.clearRect(0, 0, canvas.width, canvas.height);
      }
      loop();
    }

    // Initialize Application
    const app = new English9Game();
  </script>
</body>
