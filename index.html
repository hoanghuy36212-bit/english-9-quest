      9: [
        [1,1,"Local Community","Cộng đồng địa phương","🏘️","Wh-word + to-V & Phrasal Verbs","Bậc Thầy Làng Nghề","🏺",
          [["artisan","/ˌɑːtɪˈzæn/","(n)","nghệ nhân, thợ thủ công","The artisans in Bat Trang village make beautiful pottery."],["handicraft","/ˈhændikrɑːft/","(n)","sản phẩm thủ công","Tourists love buying local handicrafts as souvenirs."],["speciality","/ˌspeʃiˈæləti/","(n)","đặc sản","Com Vong is a famous speciality of Hanoi."],["preserve","/prɪˈzɜːv/","(v)","bảo tồn, giữ gìn","We need to preserve our traditional craft villages."]],
          ["<b>1. Wh-word + to-V:</b> Dùng sau <i>ask, wonder, decide, tell, know</i>.<br>(VD: <i>I don't know <b>where to buy</b> traditional lanterns.</i>)","<b>2. Phrasal Verbs:</b> <i>pass down (truyền lại), live on (sống nhờ vào), deal with (giải quyết), look around (ngắm nghía), cut down on (cắt giảm)</i>."],
          [["We don't know ______ to ask for advice about the local craft fair.",["who","what","why","which"],0,"'who to ask' = hỏi ai."],["The craft of basket weaving is usually ______ from generation to generation.",["passed down","cut down","looked around","found out"],0,"'pass down' nghĩa là truyền lại qua các thế hệ."],["Many families in this village ______ making conical hats.",["live on","pass down","deal with","find out"],0,"'live on' = sống nhờ vào nghề gì."]],
          [["Tôi không biết nên mua quà lưu niệm đặc sản ở đâu.","I don't know where to buy speciality souvenirs."],["Các nghệ nhân truyền lại kỹ năng của họ cho con cái.","Artisans pass down their skills to their children."]]],

      { id: "primary_explorer", name: "Chinh Phục Tiểu Học", icon: "🎒", desc: "Hoàn thành ít nhất 1 Unit ở khối Tiểu học (Lớp 1–5)." },
      { id: "secondary_scholar", name: "Học Bá THCS", icon: "🎓", desc: "Hoàn thành ít nhất 1 Unit ở khối THCS (Lớp 6–9)." },
      { id: "rich_scholar", name: "Triệu Phú Tri Thức", icon: "💰", desc: "Tích lũy được từ 250 Xu vàng trở lên." },
      { id: "level_5", name: "Chiến Binh Cấp 5", icon: "⚔️", desc: "Đạt đến Cấp độ 5 (Level 5)." },
      { id: "level_10", name: "Đại Cao Thủ Cấp 10", icon: "👑", desc: "Đạt đến Cấp độ 10 (Level 10)." }
    ];

    /**
     * ============================================================================
     * 5. GAME ENGINE & MULTI-GRADE STATE MANAGEMENT
     * ============================================================================
     */
    function createInitialGradesData() {
      const data = {};
      for (let g = 1; g <= 9; g++) {
        const count = ALL_GRADES_UNITS[g].length;
        const unitProgress = {};
        for (let u = 1; u <= count; u++) {
          unitProgress[u] = [false, false, false, false];
        }
        data[g] = {
          unitProgress,
          unlockedUnits: [1]
        };
      }
      return data;
    }

    const DEFAULT_STATE = {
      selectedGrade: 9,
      xp: 0,
      level: 1,
      coins: 100,
      hearts: 5,
      maxHearts: 5,
      hints: 3,
      streak: 1,
      lastLogin: new Date().toDateString(),
      sound: true,
      freeMode: false,
      gradesData: createInitialGradesData(),
      badges: []
    };

    class EnglishQuestApp {
      constructor() {
        this.state = this.loadState();
        this.currentTab = 'map';
        this.semesterFilter = 'all';
        this.activeSession = null;
        this.timerInterval = null;
        this.init();
      }

      loadState() {
        try {
          const saved = localStorage.getItem('eng_quest_g1_g9_v1');
          if (saved) {
            const parsed = JSON.parse(saved);
            const baseGrades = createInitialGradesData();
            if (parsed.gradesData) {
              for (let g = 1; g <= 9; g++) {
                if (parsed.gradesData[g]) {
                  baseGrades[g].unlockedUnits = parsed.gradesData[g].unlockedUnits || [1];
                  const count = ALL_GRADES_UNITS[g].length;
                  for (let u = 1; u <= count; u++) {
                    if (Array.isArray(parsed.gradesData[g].unitProgress?.[u])) {
                      baseGrades[g].unitProgress[u] = parsed.gradesData[g].unitProgress[u];
                    }
                  }
                }
              }
            }
            return {
              ...DEFAULT_STATE,
              ...parsed,
              gradesData: baseGrades
            };
          }
        } catch (e) {}
        return JSON.parse(JSON.stringify(DEFAULT_STATE));
      }

      saveState() {
        try {
          localStorage.setItem('eng_quest_g1_g9_v1', JSON.stringify(this.state));
        } catch (e) {}
        this.updateHUD();
      }

      init() {
        const today = new Date().toDateString();
        if (this.state.lastLogin !== today) {
          this.state.streak += 1;
          this.state.lastLogin = today;
          if (this.state.hearts < this.state.maxHearts) {
            this.state.hearts = this.state.maxHearts;
          }
        }
        sfx.enabled = this.state.sound;
        document.getElementById('btn-sound').textContent = this.state.sound ? '🔊' : '🔇';
        this.saveState();
        this.render();
      }

      toggleSound() {
        this.state.sound = !this.state.sound;
        sfx.enabled = this.state.sound;
        document.getElementById('btn-sound').textContent = this.state.sound ? '🔊' : '🔇';
        if (this.state.sound) sfx.click();
        this.saveState();
      }

      selectGrade(grade) {
        if (this.state.selectedGrade === grade) return;
        sfx.click();
        this.state.selectedGrade = grade;
        this.semesterFilter = 'all';
        this.saveState();
        this.showToast(`📚 Đã chuyển sang chương trình Tiếng Anh Lớp ${grade}`, '✨');
        this.render();
      }

      updateHUD() {
        const g = this.state.selectedGrade;
        const gMeta = GRADE_META.find(m => m.grade === g);
        const badgeEl = document.getElementById('hud-grade-badge');
        badgeEl.textContent = `L${g}`;
        badgeEl.className = `w-10 h-10 sm:w-11 sm:h-11 rounded-2xl bg-gradient-to-br ${gMeta.color} flex items-center justify-center text-white font-black text-base sm:text-lg shadow-md`;

        const xpNeeded = this.state.level * 100;
        const pct = Math.min(100, Math.round((this.state.xp / xpNeeded) * 100));
        document.getElementById('hud-level').textContent = `Lv.${this.state.level}`;
        document.getElementById('hud-xp-bar').style.width = `${pct}%`;
        document.getElementById('hud-xp-text').textContent = `${this.state.xp}/${xpNeeded} XP`;
        document.getElementById('hud-streak').textContent = this.state.streak;
        document.getElementById('hud-coins').textContent = this.state.coins;
        document.getElementById('hud-hearts').textContent = this.state.hearts;
      }

      addXP(amount) {
        this.state.xp += amount;
        let leveledUp = false;
        while (this.state.xp >= this.state.level * 100) {
          this.state.xp -= this.state.level * 100;
          this.state.level += 1;
          this.state.coins += 30;
          leveledUp = true;
        }
        if (this.state.level >= 5) this.unlockBadge('level_5');
        if (this.state.level >= 10) this.unlockBadge('level_10');
        if (leveledUp) {
          sfx.levelUp();
          this.showToast(`🎉 Thăng cấp! Bạn đã đạt Level ${this.state.level} (+30 Xu)`, '⭐');
        }
        this.saveState();
      }

      addCoins(amount) {
        this.state.coins += amount;
        if (this.state.coins >= 250) this.unlockBadge('rich_scholar');
        this.saveState();
      }

      loseHeart() {
        this.state.hearts = Math.max(0, this.state.hearts - 1);
        this.saveState();
        if (this.state.hearts === 0) {
          this.clearTimer();
          this.showModal(
            '💔',
            'Hết Mạng Sống!',
            'Bạn đã dùng hết Tim trong thử thách này. Hãy vào Cửa hàng dùng Xu vàng để hồi phục Tim và tiếp tục nhé!',
            [
              { label: 'Về Bản Đồ', class: 'btn-dark', onClick: () => { this.closeModal(); this.goHome(); } },
              { label: 'Vào Cửa Hàng 🏪', class: 'btn-amber', onClick: () => { this.closeModal(); this.switchTab('shop'); } }
            ]
          );
          return true;
        }
        return false;
      }

      unlockBadge(badgeId) {
        if (!this.state.badges.includes(badgeId)) {
          this.state.badges.push(badgeId);
          this.saveState();
        }
      }

      clearTimer() {
        if (this.timerInterval) {
          clearInterval(this.timerInterval);
          this.timerInterval = null;
        }
      }

      switchTab(tab) {
        sfx.click();
        this.clearTimer();
        this.activeSession = null;
        this.currentTab = tab;
        document.getElementById('bottom-nav').classList.remove('hidden');

        document.querySelectorAll('.nav-btn').forEach(btn => {
          btn.classList.remove('text-emerald-400', 'bg-emerald-950/80', 'border', 'border-emerald-800/60');
          btn.classList.add('text-slate-400');
        });
        const activeBtn = document.getElementById(`nav-${tab}`);
        if (activeBtn) {
          activeBtn.classList.remove('text-slate-400');
          activeBtn.classList.add('text-emerald-400', 'bg-emerald-950/80', 'border', 'border-emerald-800/60');
        }
        this.render();
      }

      goHome() {
        this.switchTab('map');
      }

      showToast(text, icon = '✨') {
        const toast = document.getElementById('toast');
        document.getElementById('toast-text').textContent = text;
        document.getElementById('toast-icon').textContent = icon;
        toast.classList.remove('opacity-0', '-translate-y-2');
        toast.classList.add('opacity-100', 'translate-y-0');
        clearTimeout(this.toastTimeout);
        this.toastTimeout = setTimeout(() => {
          toast.classList.remove('opacity-100', 'translate-y-0');
          toast.classList.add('opacity-0', '-translate-y-2');
        }, 2500);
      }

      showModal(icon, title, message, buttons) {
        const overlay = document.getElementById('modal-overlay');
        document.getElementById('modal-icon').textContent = icon;
        document.getElementById('modal-title').textContent = title;
        document.getElementById('modal-message').innerHTML = message;
        const actionsEl = document.getElementById('modal-actions');
        actionsEl.innerHTML = '';
        buttons.forEach(b => {
          const btn = document.createElement('button');
          btn.className = `btn-3d ${b.class || 'btn-blue'} px-5 py-2.5 rounded-2xl font-extrabold text-sm flex-1`;
          btn.textContent = b.label;
          btn.onclick = b.onClick;
          actionsEl.appendChild(btn);
        });
        overlay.classList.remove('hidden');
        overlay.classList.add('flex');
      }

      closeModal() {
        const overlay = document.getElementById('modal-overlay');
        overlay.classList.add('hidden');
        overlay.classList.remove('flex');
      }

      setSemesterFilter(filter) {
        sfx.click();
        this.semesterFilter = filter;
        this.render();
      }

      toggleFreeMode() {
        sfx.click();
        this.state.freeMode = !this.state.freeMode;
        this.saveState();
        this.showToast(
          this.state.freeMode
            ? '🔓 Đã bật Chế độ tự do: Mở khóa tất cả các Unit!'
            : '🗺️ Đã chuyển về Chế độ phiêu lưu tuần tự!',
          '✨'
        );
        this.render();
      }

      /**
       * ==========================================================================
       * 6. RENDER MAIN VIEWS (MAP WITH GRADE SELECTOR, SHOP, BADGES, PROFILE)
       * ==========================================================================
       */
      render() {
        const container = document.getElementById('app-container');
        if (this.activeSession) {
          this.renderStageSession(container);
          return;
        }
        switch (this.currentTab) {
          case 'map': this.renderMap(container); break;
          case 'shop': this.renderShop(container); break;
